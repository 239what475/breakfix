version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck      # 检查未处理的错误返回
    - govet         # Go 官方静态分析
    - staticcheck   # 更深入的静态分析
    - unused        # 未使用的变量/函数
    - gosec         # 安全检查
    - misspell      # 拼写错误
    - nilerr        # 返回 nil error 的错误模式
    - unconvert     # 不必要的类型转换

  settings:
    gosec:
      excludes:
        - G204   # Subprocess launching: kubectl calls are expected
        - G301   # Directory permissions 0755: standard
        - G304   # File inclusion: reading challenge YAML files
        - G104   # Unhandled errors: intentional best-effort calls
        - G115   # Integer conversion: exit codes are small

formatters:
  enable:
    - gofmt         # 标准格式
    - goimports     # import 排序 + 自动补全
