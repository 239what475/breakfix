version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck      # 检查未处理的错误返回
    - govet         # Go 官方静态分析
    - staticcheck   # 更深入的静态分析
    - unused        # 未使用的变量/函数
    - gosec         # 安全检查
    - misspell      # 拼写错误
    - nilerr        # 返回 nil error 的错误模式
    - unconvert     # 不必要的类型转换

  settings:
    gosec:
      excludes:
        - G204   # Subprocess launching: kubectl calls are expected
        - G301   # Directory permissions 0750/0755: standard for shared runtime dirs
        - G304   # File inclusion: reading scenario YAML files
        - G115   # Integer conversion: exit codes are small

  # Test fixtures carry hardcoded credentials, temp paths, and deliberate
  # permission modes by construction; taint analysis on them is noise. The
  # rendered upstream website under docs-site/public is untracked build
  # output that only exists on prepared machines.
  exclusions:
    paths:
      - docs-site/public
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt         # 标准格式
    - goimports     # import 排序 + 自动补全
