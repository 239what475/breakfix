syntax = "proto3";

package breakfix;

option go_package = "github.com/breakfix/breakfix/internal/proto";

service Breakfix {
    // Auth
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc Login (LoginRequest) returns (LoginResponse);

    // Challenges
    rpc ListChallenges (ListChallengesRequest) returns (ListChallengesResponse);

    // Instance lifecycle (keyed by user + challenge_id)
    rpc StartChallenge (StartChallengeRequest) returns (StartChallengeResponse);
    rpc SubmitChallenge (SubmitChallengeRequest) returns (SubmitChallengeResponse);
    rpc ResetChallenge (ResetChallengeRequest) returns (ResetChallengeResponse);

    // Terminal (first PTYData.data = challenge_id)
    rpc ExecInstance (stream PTYData) returns (stream PTYData);

    // Agent
    rpc GenerateChallenge (GenerateChallengeRequest) returns (GenerateChallengeResponse);
}

// ── Auth ──

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterResponse {
    string totp_secret = 1;
    string totp_url = 2;    // otpauth:// URL for local QR rendering
    string ca_cert = 3;
}

message LoginRequest {
    string username = 1;
    string password = 2;
    string totp_code = 3;
}

message LoginResponse {
    string user_id = 1;
    string name = 2;
    string client_cert = 3;
    string client_key = 4;
    string ca_cert = 5;
}

// ── Terminal ──

message PTYData {
    bytes data = 1;
    uint32 cols = 2;
    uint32 rows = 3;
}

// ── Challenges ──

message ListChallengesRequest {}

message ChallengeSummary {
    string id = 1;
    string title = 2;
    string type = 3;
    string difficulty = 4;
    repeated string tags = 5;
    bool solved = 6;
    bool active = 7;          // running or draining instance exists
}

message ListChallengesResponse {
    repeated ChallengeSummary challenges = 1;
}

// ── Instances ──

message StartChallengeRequest {
    string challenge_id = 1;
}

message StartChallengeResponse {
    string challenge_title = 1;
}

message SubmitChallengeRequest {
    string challenge_id = 1;
}

message SubmitChallengeResponse {
    bool passed = 1;
    int32 exit_code = 2;
    string output = 3;
}

message ResetChallengeRequest {
    string challenge_id = 1;
}

message ResetChallengeResponse {
    string challenge_title = 1;
}

// ── Agent ──

message GenerateChallengeRequest {
    string topic = 1;
}

message GenerateChallengeResponse {
    string challenge_id = 1;
    string status = 2;          // "success" | "failed"
    string detail = 3;
}
