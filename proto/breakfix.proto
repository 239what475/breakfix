syntax = "proto3";

package breakfix;

option go_package = "github.com/breakfix/breakfix/internal/proto";

service Breakfix {
    // User

    // Challenges
    rpc ListChallenges (ListChallengesRequest) returns (ListChallengesResponse);

    // Instances
    rpc StartChallenge (StartChallengeRequest) returns (StartChallengeResponse);
    rpc GetInstance (GetInstanceRequest) returns (GetInstanceResponse);
    rpc PingInstance (PingInstanceRequest) returns (PingInstanceResponse);
    rpc StopChallenge (StopChallengeRequest) returns (StopChallengeResponse);

    // Auth
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc Login (LoginRequest) returns (LoginResponse);

    // Terminal
    rpc ExecInstance (stream PTYData) returns (stream PTYData);

    // Submission
    rpc SubmitChallenge (SubmitChallengeRequest) returns (SubmitChallengeResponse);
}

// ── Auth ──

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterResponse {
    string totp_secret = 1;     // 给用户扫的密钥
    string totp_qr = 2;         // ASCII QR 码
}

message LoginRequest {
    string username = 1;
    string password = 2;
    string totp_code = 3;
}

message LoginResponse {
    string user_id = 1;
    string name = 2;
    string client_cert = 3;     // 客户端证书 PEM
    string client_key = 4;      // 客户端私钥 PEM
}

// ── Terminal ──

message PTYData {
    bytes data = 1;             // stdin/stdout 字节流
}

// ── User ──



// ── Challenges ──

message ListChallengesRequest {}

message ChallengeSummary {
    string id = 1;
    string title = 2;
    string type = 3;
    string difficulty = 4;
    repeated string tags = 5;
    bool solved = 6;
}

message ListChallengesResponse {
    repeated ChallengeSummary challenges = 1;
}

// ── Instances ──

message StartChallengeRequest {
    string challenge_id = 1;
}

message StartChallengeResponse {
    string instance_id = 1;
    string challenge_title = 2;
    int64 timeout_sec = 3;
}

message GetInstanceRequest {
    string instance_id = 1;
}

enum InstanceStatus {
    RUNNING = 0;
    DRAINING = 1;
    DESTROYED = 2;
}

message GetInstanceResponse {
    string instance_id = 1;
    string challenge_id = 2;
    InstanceStatus status = 3;
    int64 remaining_sec = 4;
}

message PingInstanceRequest {
    string instance_id = 1;
}

message PingInstanceResponse {
    InstanceStatus status = 1;
}

message StopChallengeRequest {
    string instance_id = 1;
}

message StopChallengeResponse {}

// ── Submission ──

message SubmitChallengeRequest {
    string instance_id = 1;
}

message SubmitChallengeResponse {
    bool passed = 1;
    int32 exit_code = 2;
    string output = 3;
}
