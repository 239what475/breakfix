apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: breakfix-runtime-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: breakfix-runtime-worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: breakfix-server
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: breakfix-registry
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 443}
        # kube-proxy DNATs the in-cluster Kubernetes Service to the API server
        # endpoint before this policy is enforced.
        - {protocol: TCP, port: 6443}
        - {protocol: TCP, port: 8443}
---
