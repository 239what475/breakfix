apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-generate-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-taxonomy-worker
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: breakfix-server
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["nodeenvironments", "vk8senvironments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Server owns Generator workspace PVCs. OpenSandbox only mounts them in
  # BYO mode and never receives permission to manage their lifecycle.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakfix-server
subjects:
  - kind: ServiceAccount
    name: breakfix-server
    namespace: breakfix-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: breakfix-server
---
# The controller owns user namespaces and vcluster Helm releases. Kubernetes
# rejects a Role or ClusterRole that grants permissions its creator does not
# already hold, so this includes the rendered vcluster 0.35.1 RBAC contract.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: breakfix-controller
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["nodeenvironments", "vk8senvironments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["breakfix.dev"]
    resources: ["nodeenvironments/status", "vk8senvironments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "secrets", "configmaps", "serviceaccounts", "events"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints", "persistentvolumeclaims", "resourcequotas", "limitranges", "pods/attach", "pods/portforward", "pods/exec"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status", "pods/ephemeralcontainers", "pods/resize"]
    verbs: ["update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
# Generate Worker owns verification Environment CRDs and the verification
# terminal exec call. The Controller grants its namespace-local workspace Role
# when it creates a VK8s verification environment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: breakfix-generate-worker
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["nodeenvironments", "vk8senvironments"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: breakfix-generate-worker
subjects:
  - kind: ServiceAccount
    name: breakfix-generate-worker
    namespace: breakfix-system
roleRef:
  kind: Role
  name: breakfix-generate-worker
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakfix-controller
subjects:
  - kind: ServiceAccount
    name: breakfix-controller
    namespace: breakfix-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: breakfix-controller
