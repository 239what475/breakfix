apiVersion: v1
kind: Service
metadata:
  name: breakfix-server
spec:
  selector:
    app.kubernetes.io/name: breakfix-server
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-server
    spec:
      serviceAccountName: breakfix-server
      securityContext:
        fsGroup: 65532
      containers:
        - name: server
          image: ghcr.io/breakfix/breakfix-server:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: BREAKFIX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: database_url
            - name: BREAKFIX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: jwt_secret
            - name: BREAKFIX_RUNTIME_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime-worker-identity
                  key: worker_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: deepseek_api_key
            - name: BREAKFIX_REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_username
            - name: BREAKFIX_REGISTRY_REPOSITORY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_repository
            - name: BREAKFIX_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_password
            - name: BREAKFIX_REGISTRY_TRUST_BUNDLE_FILE
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_trust_bundle_file
            - name: BREAKFIX_CATALOG_RELEASE_REFERENCE
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: catalog_release_reference
                  optional: true
            - name: OPEN_SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: opensandbox_api_key
            - name: BREAKFIX_OPENSANDBOX_BASE_URL
              value: http://opensandbox-server.opensandbox.svc.cluster.local
            - name: BREAKFIX_OPENSANDBOX_NAMESPACE
              value: opensandbox
            - name: BREAKFIX_UI_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: ui_origin
            - name: BREAKFIX_INCUS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_endpoint
                  optional: true
            - name: BREAKFIX_INCUS_BASE_IMAGE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_base_image_fingerprint
                  optional: true
            - name: BREAKFIX_INCUS_BUILD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_build_project
                  optional: true
            - name: BREAKFIX_INCUS_IMAGE_PROJECT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_image_project
                  optional: true
            - name: BREAKFIX_INCUS_NAME_PREFIX
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_name_prefix
                  optional: true
            - name: BREAKFIX_K8S_BASE_IMAGE_DIGEST
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: k8s_base_image_digest
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: documentation-library
              mountPath: /var/lib/breakfix/documentation/library
              readOnly: true
            - name: data
              mountPath: /var/lib/breakfix
            - name: incus-tls
              mountPath: /var/run/secrets/breakfix-incus
              readOnly: true
            - name: registry-ca
              mountPath: /var/run/config/breakfix-registry-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        # The documentation library is the full offline docs-project output,
        # carried by a dedicated content-only image (build/images/
        # documentation-library) and mounted read-only as an image volume: the
        # corpus is immutable, versioned, and digest-addressable exactly like
        # every other parsed input. e2e-documentation-prepare.sh swaps this
        # volume source to the mini-library ConfigMap for the E2E target.
        - name: documentation-library
          image:
            reference: ghcr.io/breakfix/breakfix-documentation-library:dev
            pullPolicy: IfNotPresent
        - name: data
          persistentVolumeClaim:
            claimName: breakfix-server-data
        - name: incus-tls
          secret:
            secretName: breakfix-incus-server
            defaultMode: 0440
            optional: true
        - name: registry-ca
          configMap:
            name: breakfix-registry-ca
            optional: true
        - name: tmp
          emptyDir: {}
