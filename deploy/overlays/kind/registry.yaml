apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: breakfix-registry-data
  labels:
    app.kubernetes.io/name: breakfix-registry
    app.kubernetes.io/part-of: breakfix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: breakfix-registry
  labels:
    app.kubernetes.io/name: breakfix-registry
    app.kubernetes.io/part-of: breakfix
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: breakfix-registry
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-registry
  labels:
    app.kubernetes.io/name: breakfix-registry
    app.kubernetes.io/part-of: breakfix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-registry
        app.kubernetes.io/part-of: breakfix
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-data-directory
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "chown -R 1000:1000 /var/lib/registry"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      containers:
        - name: registry
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 5000
          env:
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /tls/tls.key
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Breakfix Registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: REGISTRY_STORAGE
              value: filesystem
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: breakfix-registry-data
        - name: auth
          secret:
            secretName: breakfix-registry-auth
        - name: tls
          secret:
            secretName: breakfix-registry-tls
