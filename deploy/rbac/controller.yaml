# Verifier has no model, database, Server domain, namespace, or Job
# permissions. It only drives the one environment needed to verify its task.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-verifier
  namespace: breakfix-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: breakfix-verifier
  namespace: breakfix-system
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["verifytasks"]
    verbs: ["get"]
  - apiGroups: ["breakfix.dev"]
    resources: ["verifytasks/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["breakfix.dev"]
    resources: ["containerenvironments", "vclusterenvironments"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["breakfix.dev"]
    resources: ["containerenvironments/status", "vclusterenvironments/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: breakfix-verifier
  namespace: breakfix-system
subjects:
  - kind: ServiceAccount
    name: breakfix-verifier
    namespace: breakfix-system
roleRef:
  kind: Role
  name: breakfix-verifier
  apiGroup: rbac.authorization.k8s.io
