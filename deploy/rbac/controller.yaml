# RBAC for generator Jobs and controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: breakfix-system
---
# ServiceAccount for generator Jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-generator
  namespace: breakfix-system
---
# Namespace-scoped permissions (CRDs + jobs in breakfix-system)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: breakfix-generator
  namespace: breakfix-system
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["generations", "containerenvironments", "vclusterenvironments", "verifytasks"]
    verbs: ["create", "get", "list", "update", "patch", "delete", "watch"]
  - apiGroups: ["breakfix.dev"]
    resources: ["generations/status", "containerenvironments/status", "vclusterenvironments/status", "verifytasks/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: breakfix-generator
  namespace: breakfix-system
subjects:
  - kind: ServiceAccount
    name: breakfix-generator
    namespace: breakfix-system
roleRef:
  kind: Role
  name: breakfix-generator
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped permission for namespace management (lab tools)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: breakfix-generator
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakfix-generator
subjects:
  - kind: ServiceAccount
    name: breakfix-generator
    namespace: breakfix-system
roleRef:
  kind: ClusterRole
  name: breakfix-generator
  apiGroup: rbac.authorization.k8s.io
