apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: breakfix-untrusted-builder-egress
spec:
  podSelector:
    matchLabels:
      breakfix.dev/role: build
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: breakfix-server
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
