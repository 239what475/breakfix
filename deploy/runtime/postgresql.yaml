apiVersion: v1
kind: ConfigMap
metadata:
  name: breakfix-postgresql-init
data:
  01-create-agent-role.sh: |
    #!/bin/sh
    set -eu
    psql --set=ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=agent_password="$BREAKFIX_AGENT_DATABASE_PASSWORD" <<'EOSQL'
    CREATE ROLE breakfix_agent LOGIN PASSWORD :'agent_password';
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: breakfix-postgresql
spec:
  selector:
    app.kubernetes.io/name: breakfix-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: breakfix-postgresql
spec:
  serviceName: breakfix-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-postgresql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # The PostgreSQL process stays non-root. This narrowly scoped step owns
        # the dynamically provisioned data directory before PostgreSQL starts.
        - name: prepare-data-directory
          image: postgres:17.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "chown 70:70 /var/lib/postgresql/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgresql
          image: postgres:17.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: breakfix
            - name: POSTGRES_USER
              value: breakfix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: postgres_password
            - name: BREAKFIX_AGENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: agent_database_password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U breakfix -d breakfix"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U breakfix -d breakfix"]
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: breakfix-postgresql-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
