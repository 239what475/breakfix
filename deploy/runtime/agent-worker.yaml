apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-agent-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-agent-worker
    spec:
      serviceAccountName: breakfix-agent-worker
      automountServiceAccountToken: false
      containers:
        - name: agent-worker
          image: ghcr.io/breakfix/breakfix-agent-worker:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BREAKFIX_AGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: agent_database_url
            - name: BREAKFIX_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: internal_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: deepseek_api_key
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        - name: tmp
          emptyDir: {}
