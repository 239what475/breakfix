apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-agent-worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-agent-worker
    spec:
      serviceAccountName: breakfix-agent-worker
      automountServiceAccountToken: false
      containers:
        - name: agent-worker
          image: ghcr.io/breakfix/breakfix-agent-worker:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BREAKFIX_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-agent-worker-identity
                  key: worker_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: deepseek_api_key
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        - name: tmp
          emptyDir: {}
