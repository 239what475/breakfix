apiVersion: v1
kind: Service
metadata:
  name: breakfix-server
spec:
  selector:
    app.kubernetes.io/name: breakfix-server
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-server
    spec:
      serviceAccountName: breakfix-server
      securityContext:
        fsGroup: 65532
      containers:
        - name: server
          image: ghcr.io/breakfix/breakfix-server:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: BREAKFIX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: database_url
            - name: BREAKFIX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: jwt_secret
            - name: BREAKFIX_GENERATE_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-generate-worker-identity
                  key: worker_api_key
            - name: BREAKFIX_TAXONOMY_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-taxonomy-worker-identity
                  key: worker_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: deepseek_api_key
            - name: BREAKFIX_REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_username
            - name: BREAKFIX_REGISTRY_ADDR
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_addr
            - name: BREAKFIX_REGISTRY_CLIENT_ADDR
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_client_addr
            - name: BREAKFIX_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_password
            - name: BREAKFIX_REGISTRY_TRUST_BUNDLE_FILE
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_trust_bundle_file
            - name: OPEN_SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: opensandbox_api_key
            - name: BREAKFIX_OPENSANDBOX_BASE_URL
              value: http://opensandbox-server.opensandbox.svc.cluster.local
            - name: BREAKFIX_OPENSANDBOX_NAMESPACE
              value: opensandbox
            - name: BREAKFIX_UI_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: ui_origin
            - name: BREAKFIX_INCUS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_endpoint
            - name: BREAKFIX_INCUS_BASE_IMAGE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_base_image_fingerprint
            - name: BREAKFIX_K8S_BASE_IMAGE_DIGEST
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: k8s_base_image_digest
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: data
              mountPath: /var/lib/breakfix
            - name: incus-tls
              mountPath: /var/run/secrets/breakfix-incus
              readOnly: true
            - name: registry-ca
              mountPath: /var/run/config/breakfix-registry-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        - name: data
          persistentVolumeClaim:
            claimName: breakfix-server-data
        - name: incus-tls
          secret:
            secretName: breakfix-incus-server
            defaultMode: 0440
        - name: registry-ca
          configMap:
            name: breakfix-registry-ca
            optional: true
        - name: tmp
          emptyDir: {}
