apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-builder
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-builder
        breakfix.dev/worker-kind: build
    spec:
      serviceAccountName: breakfix-builder
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: builder
          image: ghcr.io/breakfix/breakfix-builder:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BREAKFIX_WORKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-builder-identity
                  key: worker_api_key
            - name: BREAKFIX_INCUS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_endpoint
            - name: BREAKFIX_INCUS_BASE_IMAGE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_base_image_fingerprint
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: incus-tls
              mountPath: /var/run/secrets/breakfix-incus
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        - name: incus-tls
          secret:
            secretName: breakfix-incus-builder
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 5Gi
