apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-builder
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-publisher
automountServiceAccountToken: false
---
# Verifier needs only the control-namespace CRDs and Pod exec access. The
# Controller grants its separate namespace-local terminal Role when it creates
# a VK8s verification Environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-verifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: breakfix-verifier
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["nodeenvironments", "vk8senvironments"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: breakfix-verifier
subjects:
  - kind: ServiceAccount
    name: breakfix-verifier
    namespace: breakfix-system
roleRef:
  kind: Role
  name: breakfix-verifier
  apiGroup: rbac.authorization.k8s.io
