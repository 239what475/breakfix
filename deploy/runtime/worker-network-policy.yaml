apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: breakfix-agent-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: breakfix-agent-worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: breakfix-server
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: breakfix-registry
      ports:
        - {protocol: TCP, port: 5000}
---
