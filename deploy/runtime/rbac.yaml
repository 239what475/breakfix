apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: breakfix-agent-worker
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: breakfix-server
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["containerenvironments", "vclusterenvironments", "verifytasks"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["breakfix.dev"]
    resources: ["containerenvironments/status", "vclusterenvironments/status", "verifytasks/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Server owns Generator workspace PVCs. OpenSandbox only mounts them in
  # BYO mode and never receives permission to manage their lifecycle.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakfix-server
subjects:
  - kind: ServiceAccount
    name: breakfix-server
    namespace: breakfix-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: breakfix-server
---
# The controller owns user namespaces and vcluster Helm releases. Its explicit
# resource list covers the native resources created by those reconcilers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: breakfix-controller
rules:
  - apiGroups: ["breakfix.dev"]
    resources: ["containerenvironments", "vclusterenvironments", "verifytasks"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["breakfix.dev"]
    resources: ["containerenvironments/status", "vclusterenvironments/status", "verifytasks/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "secrets", "configmaps", "serviceaccounts", "events"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakfix-controller
subjects:
  - kind: ServiceAccount
    name: breakfix-controller
    namespace: breakfix-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: breakfix-controller
