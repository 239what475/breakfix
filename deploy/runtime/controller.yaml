apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-controller
    spec:
      serviceAccountName: breakfix-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: controller
          image: ghcr.io/breakfix/breakfix-controller:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: HOME
              value: /tmp
            - name: BREAKFIX_REGISTRY_PULL_SECRET
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_pull_secret
            - name: BREAKFIX_INCUS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_endpoint
            - name: BREAKFIX_INCUS_BASE_IMAGE_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: incus_base_image_fingerprint
            - name: BREAKFIX_K8S_BASE_IMAGE_DIGEST
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: k8s_base_image_digest
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: incus-tls
              mountPath: /var/run/secrets/breakfix-incus
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        - name: tmp
          emptyDir: {}
        - name: incus-tls
          secret:
            secretName: breakfix-incus-controller
            defaultMode: 0440
