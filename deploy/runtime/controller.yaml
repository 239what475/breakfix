apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakfix-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breakfix-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakfix-controller
    spec:
      serviceAccountName: breakfix-controller
      containers:
        - name: controller
          image: ghcr.io/breakfix/breakfix-controller:dev
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/breakfix/config.yaml"]
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: BREAKFIX_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: internal_api_key
            - name: BREAKFIX_REGISTRY_ADDR
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_addr
            - name: BREAKFIX_REGISTRY_INSECURE
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_insecure
            - name: BREAKFIX_REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_username
            - name: BREAKFIX_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: breakfix-runtime
                  key: registry_password
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: config
              mountPath: /etc/breakfix
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: breakfix-config
        - name: tmp
          emptyDir: {}
