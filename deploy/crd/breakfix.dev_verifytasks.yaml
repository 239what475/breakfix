apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: verifytasks.breakfix.dev
spec:
  group: breakfix.dev
  names:
    kind: VerifyTask
    listKind: VerifyTaskList
    plural: verifytasks
    singular: verifytask
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [source, submission]
              properties:
                source:
                  type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                    ref:
                      type: string
                submission:
                  type: object
                  required: [id]
                  properties:
                    id:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Verified, Failed, Succeeded]
                message:
                  type: string
                jobName:
                  type: string
                podName:
                  type: string
                tempImage:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                report:
                  type: object
                  properties:
                    buildPassed:
                      type: boolean
                    answerPassed:
                      type: boolean
                    verifyPassed:
                      type: boolean
                    summary:
                      type: string
                    issues:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                          message:
                            type: string
