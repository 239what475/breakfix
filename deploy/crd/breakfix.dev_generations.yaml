apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: generations.breakfix.dev
spec:
  group: breakfix.dev
  names:
    kind: Generation
    listKind: GenerationList
    plural: generations
    singular: generation
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, envSecretRef]
              properties:
                image:
                  type: string
                envSecretRef:
                  type: string
                authoringSessionRef:
                  type: string
                authoringRevision:
                  type: integer
                  format: int64
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Verifying, Verified, Failed]
                jobName:
                  type: string
                podName:
                  type: string
                challenge:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    type:
                      type: string
                    runtime:
                      type: string
                    difficulty:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    description:
                      type: string
                    image:
                      type: string
                verifyTaskRef:
                  type: string
                submissionID:
                  type: string
                artifactRevision:
                  type: integer
                  format: int64
                attempt:
                  type: integer
                  format: int64
                message:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
