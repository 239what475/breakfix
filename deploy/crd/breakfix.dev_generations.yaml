apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: generations.breakfix.dev
spec:
  group: breakfix.dev
  names:
    kind: Generation
    listKind: GenerationList
    plural: generations
    singular: generation
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                draft:
                  type: object
                  properties:
                    title:
                      type: string
                    difficulty:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    description:
                      type: string
                    goal:
                      type: string
                    symptoms:
                      type: string
                    fault_mechanism:
                      type: string
                    environment_shape:
                      type: string
                    acceptance_criteria:
                      type: string
                    difficulty_reason:
                      type: string
                    notes:
                      type: string
                image:
                  type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed]
                jobName:
                  type: string
                podName:
                  type: string
                challenge:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    type:
                      type: string
                    difficulty:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    description:
                      type: string
                    image:
                      type: string
                message:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
