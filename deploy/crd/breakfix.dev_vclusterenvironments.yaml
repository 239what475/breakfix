apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vclusterenvironments.breakfix.dev
spec:
  group: breakfix.dev
  names:
    kind: VClusterEnvironment
    listKind: VClusterEnvironmentList
    plural: vclusterenvironments
    singular: vclusterenvironment
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [challengeRef, userRef, image]
              properties:
                challengeRef:
                  type: string
                userRef:
                  type: string
                image:
                  type: string
                submit:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Draining, Destroyed, Failed]
                namespace:
                  type: string
                workspacePodName:
                  type: string
                vclusterName:
                  type: string
                kubeconfigSecretName:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                message:
                  type: string
                submitResult:
                  type: object
                  properties:
                    passed:
                      type: boolean
                    exitCode:
                      type: integer
                    output:
                      type: string
                    submittedAt:
                      type: string
                      format: date-time
