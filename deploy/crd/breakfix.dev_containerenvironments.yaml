apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: containerenvironments.breakfix.dev
spec:
  group: breakfix.dev
  names:
    kind: ContainerEnvironment
    listKind: ContainerEnvironmentList
    plural: containerenvironments
    singular: containerenvironment
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [challengeRef, userRef, image]
              properties:
                challengeRef:
                  type: string
                userRef:
                  type: string
                image:
                  type: string
                submit:
                  type: boolean
                timeouts:
                  type: object
                  properties:
                    readyTimeoutSeconds:
                      type: integer
                      format: int64
                    idleTtlSeconds:
                      type: integer
                      format: int64
                    drainGracePeriodSeconds:
                      type: integer
                      format: int64
                    destroyTimeoutSeconds:
                      type: integer
                      format: int64
                cleanupPolicy:
                  type: object
                  properties:
                    autoDestroyAfterSubmit:
                      type: boolean
                    autoDestroyAfterIdle:
                      type: boolean
                    forceCleanupOnFailure:
                      type: boolean
                resources:
                  type: object
                  properties:
                    workspaceCpu:
                      type: string
                    workspaceMemory:
                      type: string
                    workspaceEphemeralStorage:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Draining, Submitted, Destroyed, Failed]
                observedGeneration:
                  type: integer
                  format: int64
                namespace:
                  type: string
                workspacePodName:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                readyAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                destroyedAt:
                  type: string
                  format: date-time
                reason:
                  type: string
                lastError:
                  type: object
                  properties:
                    component:
                      type: string
                    code:
                      type: string
                    message:
                      type: string
                    at:
                      type: string
                      format: date-time
                    retriable:
                      type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                message:
                  type: string
                submitResult:
                  type: object
                  properties:
                    passed:
                      type: boolean
                    exitCode:
                      type: integer
                    output:
                      type: string
                    submittedAt:
                      type: string
                      format: date-time
