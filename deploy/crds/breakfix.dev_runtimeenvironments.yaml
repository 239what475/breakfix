      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RuntimeEnvironmentSpec contains only Server-owned controls. Runtime
              profile, artifact, plan, and lifecycle policy are dereferenced from the
              immutable RunnableRevision and never copied into the CRD; a blank
              environment names no revision and the Controller resolves its installed
              runtime definition from configuration instead.
            properties:
              blankRuntime:
                description: |-
                  BlankRuntimeSpec selects a system blank runtime in place of a runnable
                  revision. A blank environment exists for free-form hands-on practice: it
                  provisions the installed runtime with no content, artifact, or plan.
                properties:
                  provider:
                    enum:
                    - k8s
                    type: string
                required:
                - provider
                type: object
              lease:
                description: |-
                  LeaseSpec is exclusively updated by Server. The API server enforces its
                  monotonic fields while the Controller only observes it.
                properties:
                  releaseAt:
                    format: date-time
                    type: string
                  renewedAt:
                    format: date-time
                    type: string
                required:
                - renewedAt
                type: object
                x-kubernetes-validations:
                - message: renewedAt must be monotonic
                  rule: oldSelf == null || self.renewedAt >= oldSelf.renewedAt
                - message: releaseAt must be monotonic once set
                  rule: oldSelf == null || !has(oldSelf.releaseAt) || (has(self.releaseAt)
                    && self.releaseAt >= oldSelf.releaseAt)
              purpose:
                enum:
                - learning
                - verification
                type: string
              resetNonce:
                format: int64
                minimum: 0
                type: integer
              runnableRevisionRef:
                properties:
                  digest:
                    type: string
                  id:
                    type: string
                required:
                - digest
                - id
                type: object
            required:
            - lease
            - purpose
            type: object
            x-kubernetes-validations:
            - message: runnableRevisionRef is immutable
              rule: oldSelf == null || self.runnableRevisionRef == oldSelf.runnableRevisionRef
            - message: blankRuntime is immutable
              rule: oldSelf == null || self.blankRuntime == oldSelf.blankRuntime
            - message: blankRuntime excludes runnableRevisionRef
              rule: '!has(self.blankRuntime) || (self.runnableRevisionRef.id == ”
                && self.runnableRevisionRef.digest == ”)'
            - message: runnableRevisionRef requires id and digest when blankRuntime
                is absent
              rule: has(self.blankRuntime) || (self.runnableRevisionRef.id != ” &&
                self.runnableRevisionRef.digest != ”)
            - message: purpose is immutable
              rule: oldSelf == null || self.purpose == oldSelf.purpose
            - message: resetNonce must be monotonic
              rule: oldSelf == null || !has(oldSelf.resetNonce) || (has(self.resetNonce)
                && self.resetNonce >= oldSelf.resetNonce)
          status:
