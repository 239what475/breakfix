                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failure:
                properties:
                  at:
                    format: date-time
                    type: string
                  class:
                    enum:
                    - artifact
                    - infrastructure
                    type: string
                  component:
                    type: string
                  message:
                    maxLength: 1024
                    type: string
                  reason:
                    type: string
                required:
                - at
                - class
                - component
                - reason
                type: object
              lifecycle:
                properties:
                  expiresAt:
                    format: date-time
                    type: string
                  releasedAt:
                    format: date-time
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              operation:
                enum:
                - None
                - Resetting
                type: string
              phase:
                enum:
                - Pending
                - Provisioning
                - Ready
                - Draining
                - Released
                - Failed
                type: string
              progress:
                properties:
                  attempt:
                    format: int64
                    type: integer
                  phaseId:
                    type: string
                  reportRef:
                    properties:
                      digest:
                        type: string
                      id:
                        type: string
                    required:
                    - digest
                    - id
                    type: object
                required:
                - reportRef
                type: object
              runtime:
                properties:
                  endpointRefs:
                    items:
                      properties:
                        name:
                          type: string
                        ref:
                          type: string
                      required:
                      - name
                      - ref
                      type: object
                    type: array
                  profileDigest:
                    type: string
                  provider:
                    enum:
                    - node
                    - k8s
                    type: string
                  resourceRefs:
                    items:
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                        provider:
                          type: string
                      required:
                      - id
                      - kind
                      - provider
                      type: object
                    type: array
                required:
                - profileDigest
                - provider
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
