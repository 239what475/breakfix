openapi: "3.0.3"
info:
  title: Breakfix API
  version: "1.0.0"
  description: SRE/DevOps interview practice platform
servers:
  - url: http://localhost:9090/api
    description: Local dev

paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Login with password + TOTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /me/space:
    get:
      operationId: getMySpace
      summary: Get the authenticated user's learning space
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning history, active environments, and authoring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpace"
        "401":
          $ref: "#/components/responses/Error"

  /me/space/learning:
    get:
      operationId: getMySpaceLearning
      summary: Page durable learning history for the authenticated user
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: state
          in: query
          description: Filter attempts by their current learning state
          schema:
            type: string
            enum: [active, completed, ended]
        - name: runtime
          in: query
          description: Filter attempts by environment runtime
          schema:
            type: string
            enum: [container, vcluster]
      responses:
        "200":
          description: One page of learning history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpaceLearningPage"
        "401":
          $ref: "#/components/responses/Error"

  /challenges:
    get:
      operationId: listChallenges
      summary: List all challenges
      tags: [challenges]
      responses:
        "200":
          description: Challenge list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeList"

  /challenges/{id}/start:
    post:
      operationId: startChallenge
      summary: Start or resume a challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/content:
    get:
      operationId: getChallengeContent
      summary: Get challenge problem, solution, hints, and checkpoint metadata
      tags: [challenges]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeContent"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/progress:
    get:
      operationId: getChallengeProgress
      summary: Read the controller-owned current challenge checkpoint snapshot
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current checkpoint results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgress"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant:
    get:
      operationId: getChallengeAssistant
      summary: Read or create the assistant conversation for the active challenge environment
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment-scoped assistant conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant/messages:
    post:
      operationId: sendChallengeAssistantMessage
      summary: Send a message to the active challenge assistant and receive SSE events
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "200":
          description: Server-sent assistant status, tool, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant/turns/{turnID}/events:
    get:
      operationId: streamChallengeAssistantTurn
      summary: Reconnect to a running assistant response stream
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: turnID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent assistant status, tool, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/reset:
    post:
      operationId: resetChallenge
      summary: Reset challenge to initial state
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/stop:
    post:
      operationId: stopChallenge
      summary: Stop the current challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/terminals/{window}:
    delete:
      operationId: closeTerminalWindow
      summary: Close one terminal tab in the current challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
      responses:
        "200":
          description: Terminal window closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalWindowCloseResponse"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions:
    post:
      operationId: createAuthoringSession
      summary: Create a human-reviewed challenge authoring session
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoring session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/sessions/current:
    get:
      operationId: getCurrentAuthoringSession
      summary: Resume the latest unfinished authoring session for the current user
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current unfinished authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}:
    get:
      operationId: getAuthoringSession
      summary: Read the current authoring revision, conversation, assets, and diff
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      responses:
        "200":
          description: Current authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}/messages:
    post:
      operationId: sendAuthoringMessage
      summary: Send one natural-language instruction to the authoring agent
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringMessageRequest"
      responses:
        "200":
          description: Updated authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}/generate:
    post:
      operationId: confirmAuthoringGeneration
      summary: Explicitly start generation and real verification for the current intent revision
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      responses:
        "200":
          description: Generator Run and verification started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/sessions/{id}/publish:
    post:
      operationId: publishAuthoringRevision
      summary: Explicitly publish the current verified authoring revision
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      responses:
        "200":
          description: Verified revision published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    AuthoringSessionID:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 6

    RegisterResponse:
      type: object
      required: [totp_secret, totp_url]
      properties:
        totp_secret:
          type: string
        totp_url:
          type: string

    LoginRequest:
      type: object
      required: [username, password, totp_code]
      properties:
        username:
          type: string
        password:
          type: string
        totp_code:
          type: string

    LoginResponse:
      type: object
      required: [token, user_id, name]
      properties:
        token:
          type: string
          description: JWT access token
        user_id:
          type: string
        name:
          type: string

    MySpaceChallenge:
      type: object
      required: [id, title, runtime, difficulty]
      properties:
        id:
          type: string
        title:
          type: string
        runtime:
          type: string
          enum: [container, vcluster]
        difficulty:
          type: string

    MySpaceProfile:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    MySpaceEnvironmentQuota:
      type: object
      required: [occupied, maximum]
      properties:
        occupied:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
          nullable: true

    MySpaceSummary:
      type: object
      required: [completed_count, attempted_count, in_progress_environment_count, terminal_learning_seconds, authoring_count, published_count, environment_quota]
      properties:
        completed_count:
          type: integer
          minimum: 0
        attempted_count:
          type: integer
          minimum: 0
        in_progress_environment_count:
          type: integer
          minimum: 0
        terminal_learning_seconds:
          type: integer
          minimum: 0
        authoring_count:
          type: integer
          minimum: 0
        published_count:
          type: integer
          minimum: 0
        environment_quota:
          $ref: "#/components/schemas/MySpaceEnvironmentQuota"

    MySpaceActiveEnvironment:
      type: object
      required: [environment_id, challenge, runtime, phase, checkpoint_progress]
      properties:
        environment_id:
          type: string
        challenge:
          $ref: "#/components/schemas/MySpaceChallenge"
        runtime:
          type: string
          enum: [container, vcluster]
        phase:
          type: string
        checkpoint_progress:
          $ref: "#/components/schemas/CheckpointProgressSummary"
        expires_at:
          type: string
          format: date-time
          nullable: true

    MySpaceLearningHistory:
      type: object
      required: [challenge, ready_at, learning_seconds, state]
      properties:
        challenge:
          $ref: "#/components/schemas/MySpaceChallenge"
        ready_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        learning_seconds:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [active, completed, stopped, reset, expired]

    MySpaceLearningPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceLearningHistory"
        next_cursor:
          type: string
          nullable: true

    MySpaceAuthoringDraft:
      type: object
      required: [session_id, title, state, updated_at]
      properties:
        session_id:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [DraftConversation, IntentReview, GeneratingAndVerifying, VerificationInfrastructureFailed, AwaitingVerifiedReview, RevisingAndVerifying, Publishing, Published]
        updated_at:
          type: string
          format: date-time

    MySpacePublishedChallenge:
      type: object
      required: [challenge, published_at, taxonomy_status, attempted_users, completed_users]
      properties:
        challenge:
          $ref: "#/components/schemas/MySpaceChallenge"
        published_at:
          type: string
          format: date-time
        taxonomy_status:
          type: string
          enum: [mapped, mapping, retrying, blocked]
        attempted_users:
          type: integer
          minimum: 0
        completed_users:
          type: integer
          minimum: 0
        pass_rate:
          type: number
          format: float
          nullable: true

    MySpaceAuthoring:
      type: object
      required: [drafts, published]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceAuthoringDraft"
        published:
          type: array
          items:
            $ref: "#/components/schemas/MySpacePublishedChallenge"

    MySpace:
      type: object
      required: [profile, summary, active_environments, recent_learning, recent_learning_next_cursor, authoring]
      properties:
        profile:
          $ref: "#/components/schemas/MySpaceProfile"
        summary:
          $ref: "#/components/schemas/MySpaceSummary"
        active_environments:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceActiveEnvironment"
        recent_learning:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceLearningHistory"
        recent_learning_next_cursor:
          type: string
          nullable: true
        authoring:
          $ref: "#/components/schemas/MySpaceAuthoring"

    ChallengeSummary:
      type: object
      required: [id, title, type, runtime, difficulty, tags, primary_outcome, description, published_at]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        runtime:
          type: string
          enum: [container, vcluster]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyReference"
        primary_outcome:
          $ref: "#/components/schemas/TaxonomyReference"
        description:
          type: string
        published_at:
          type: string
          format: date-time
        solved:
          type: boolean
        active:
          type: boolean
        progress:
          $ref: "#/components/schemas/CheckpointProgressSummary"

    CheckpointProgressSummary:
      type: object
      required: [passed, total]
      properties:
        passed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    ChallengeList:
      type: object
      required: [challenges]
      properties:
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeSummary"

    TaxonomyReference:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string

    ChallengeOutcome:
      type: object
      required: [id, title, primary]
      properties:
        id:
          type: string
        title:
          type: string
        primary:
          type: boolean

    ChallengeEntrySkill:
      type: object
      required: [id, title, requires]
      properties:
        id:
          type: string
        title:
          type: string
        requires:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyReference"

    ChallengeTaxonomy:
      type: object
      required: [revision, tags, primary_outcome, outcomes, entry_skills]
      properties:
        revision:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyReference"
        primary_outcome:
          $ref: "#/components/schemas/TaxonomyReference"
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeOutcome"
        entry_skills:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeEntrySkill"

    ChallengeCheckpoint:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        hint:
          type: string
        depends_on:
          type: array
          items:
            type: string

    CheckpointResult:
      type: object
      required: [id, passed, summary]
      properties:
        id:
          type: string
        passed:
          type: boolean
        summary:
          type: string
        details:
          type: string

    ChallengeContent:
      type: object
      required: [id, title, problem, solution, hints, checkpoints, taxonomy]
      properties:
        id:
          type: string
        title:
          type: string
        problem:
          type: string
        solution:
          type: string
        hints:
          type: object
          additionalProperties:
            type: string
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeCheckpoint"
        taxonomy:
          $ref: "#/components/schemas/ChallengeTaxonomy"

    ChallengeProgress:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointResult"

    AssistantEvidence:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
        label:
          type: string

    AssistantMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AssistantEvidence"
        created_at:
          type: string

    AssistantConversation:
      type: object
      required: [id, challenge_id, messages]
      properties:
        id:
          type: string
        challenge_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
        active_turn:
          $ref: "#/components/schemas/AssistantTurn"

    AssistantTurn:
      type: object
      required: [id, session_id, status, content, created_at, updated_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        status:
          type: string
          enum: [running, completed, failed]
        content:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AssistantEvidence"
        error:
          type: string
        message:
          $ref: "#/components/schemas/AssistantMessage"
        created_at:
          type: string
        updated_at:
          type: string

    AssistantMessageRequest:
      type: object
      required: [content, current_window, open_windows]
      properties:
        content:
          type: string
        current_window:
          type: string
        open_windows:
          type: array
          items:
            type: string

    StartResponse:
      type: object
      required: [challenge_title]
      properties:
        challenge_title:
          type: string

    ResetResponse:
      type: object
      required: [challenge_title]
      properties:
        challenge_title:
          type: string
    StopResponse:
      type: object
      required: [stopped, challenge_title]
      properties:
        stopped:
          type: boolean
        challenge_title:
          type: string

    TerminalWindowCloseResponse:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean

    AuthoringMetadata:
      type: object
      required:
        - title
        - difficulty
        - description
        - runtime
      properties:
        title:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        description:
          type: string
        runtime:
          type: string
          enum: [container, vcluster]

    AuthoringCheckpoint:
      type: object
      required: [id, title, markdown, position]
      properties:
        id:
          type: string
        title:
          type: string
        markdown:
          type: string
        position:
          type: integer

    AuthoringPlan:
      type: object
      required: [metadata, overview, checkpoints]
      properties:
        metadata:
          $ref: "#/components/schemas/AuthoringMetadata"
        overview:
          type: string
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringCheckpoint"

    VerifiedCheckpoint:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        hint:
          type: string
        depends_on:
          type: array
          items:
            type: string

    VerifiedChallenge:
      type: object
      required: [metadata, checkpoints]
      properties:
        metadata:
          $ref: "#/components/schemas/AuthoringMetadata"
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/VerifiedCheckpoint"

    AuthoringArtifact:
      type: object
      required: [submission_id, directory, generator_run_id]
      properties:
        submission_id:
          type: string
        directory:
          type: string
        generator_run_id:
          type: string

    AuthoringVerification:
      type: object
      required: [task_id, phase, message]
      properties:
        task_id:
          type: string
        phase:
          type: string
        message:
          type: string
        report:
          $ref: "#/components/schemas/AuthoringVerificationReport"
        challenge_id:
          type: string

    AuthoringVerificationReport:
      type: object
      required: [build_passed, answer_passed, checkpoints_passed]
      properties:
        class:
          type: string
          enum: [artifact, infrastructure]
        build_passed:
          type: boolean
        answer_passed:
          type: boolean
        checkpoints_passed:
          type: boolean
        summary:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringVerificationIssue"

    AuthoringVerificationIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    AuthoringChange:
      type: object
      required: [kind, summary, difficulty_impact, revision]
      properties:
        kind:
          type: string
        summary:
          type: string
        difficulty_impact:
          type: string
        revision:
          type: integer

    AuthoringMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, agent, system, event]
        content:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringChange"
        created_at:
          type: string
          format: date-time

    AuthoringAsset:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string

    AuthoringFileDiff:
      type: object
      required: [path, diff]
      properties:
        path:
          type: string
        diff:
          type: string

    AuthoringMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    AuthoringSession:
      type: object
      required: [id, state, authoring_turn_active, intent_revision, visible_revision, updated_at, intent, messages, assets, diff]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [DraftConversation, IntentReview, GeneratingAndVerifying, VerificationInfrastructureFailed, AwaitingVerifiedReview, RevisingAndVerifying, Publishing, Published]
        authoring_turn_active:
          type: boolean
          description: Whether the durable authoring Agent Run is pending or running. While true, the plan is being updated privately and author actions are unavailable.
        intent_revision:
          type: integer
        visible_revision:
          type: integer
        generator_run_id:
          type: string
        verify_task_id:
          type: string
        publish_challenge_id:
          type: string
        updated_at:
          type: string
          format: date-time
        intent:
          $ref: "#/components/schemas/AuthoringPlan"
        artifact:
          $ref: "#/components/schemas/AuthoringArtifact"
        verified:
          $ref: "#/components/schemas/VerifiedChallenge"
        verification:
          $ref: "#/components/schemas/AuthoringVerification"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringMessage"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringAsset"
        diff:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringFileDiff"
