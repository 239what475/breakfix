openapi: "3.0.3"
info:
  title: Breakfix API
  version: "1.0.0"
  description: SRE/DevOps interview practice platform
servers:
  - url: http://localhost:9090/api
    description: Local dev

paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Login with password + TOTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /challenges:
    get:
      operationId: listChallenges
      summary: List all challenges
      tags: [challenges]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Challenge list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeList"

  /challenges/{id}/start:
    post:
      operationId: startChallenge
      summary: Start or resume a challenge instance
      tags: [instances]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Instance ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/submit:
    post:
      operationId: submitChallenge
      summary: Submit solution for verification
      tags: [instances]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/reset:
    post:
      operationId: resetChallenge
      summary: Reset challenge to initial state
      tags: [instances]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "404":
          $ref: "#/components/responses/Error"

  /generate:
    post:
      operationId: createGenerationJob
      summary: Start generation for a reviewed challenge draft
      tags: [agent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationJobCreateRequest"
      responses:
        "200":
          description: Generation job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJobResponse"

  /generate/draft:
    post:
      operationId: reviewGenerationDraft
      summary: Review and expand a challenge idea into a structured draft
      tags: [agent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDraftRequest"
      responses:
        "200":
          description: Draft review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDraftResponse"

  /generate/jobs/{id}:
    get:
      operationId: getGenerationJob
      summary: Get generation job status
      tags: [agent]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generation job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJobResponse"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 6

    RegisterResponse:
      type: object
      properties:
        totp_secret:
          type: string
        totp_url:
          type: string

    LoginRequest:
      type: object
      required: [username, password, totp_code]
      properties:
        username:
          type: string
        password:
          type: string
        totp_code:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user_id:
          type: string
        name:
          type: string

    ChallengeSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        difficulty:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        solved:
          type: boolean
        active:
          type: boolean

    ChallengeList:
      type: object
      properties:
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeSummary"

    StartResponse:
      type: object
      properties:
        challenge_title:
          type: string

    SubmitResponse:
      type: object
      properties:
        passed:
          type: boolean
        exit_code:
          type: integer
        output:
          type: string

    ResetResponse:
      type: object
      properties:
        challenge_title:
          type: string

    ChallengeDraft:
      type: object
      required:
        - title
        - difficulty
        - tags
        - description
        - goal
        - symptoms
        - fault_mechanism
        - environment_shape
        - acceptance_criteria
        - difficulty_reason
      properties:
        title:
          type: string
        difficulty:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        goal:
          type: string
        symptoms:
          type: string
        fault_mechanism:
          type: string
        environment_shape:
          type: string
        acceptance_criteria:
          type: string
        difficulty_reason:
          type: string
        notes:
          type: string

    GenerateDraftRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string

    GenerateDraftResponse:
      type: object
      properties:
        status:
          type: string
        verdict:
          type: string
        reason:
          type: string
        warnings:
          type: array
          items:
            type: string
        draft:
          $ref: "#/components/schemas/ChallengeDraft"

    GenerationJobCreateRequest:
      type: object
      required: [draft]
      properties:
        draft:
          $ref: "#/components/schemas/ChallengeDraft"

    GenerationJobResponse:
      type: object
      properties:
        job_id:
          type: string
        challenge_id:
          type: string
        status:
          type: string
        message:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
