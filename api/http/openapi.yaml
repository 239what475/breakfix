openapi: "3.0.3"
info:
  title: Breakfix API
  version: "1.0.0"
  description: SRE/DevOps operations scenario practice platform
servers:
  - url: http://localhost:9090/api
    description: Local dev

paths:
  /documentation/page:
    get:
      operationId: getDocumentationPage
      summary: One parsed library page verified against its offline digest (public read)
      tags: [documentation]
      parameters:
        - name: path
          in: query
          required: true
          description: Library page path, for example docs/concepts/workloads/pods/pod-lifecycle
          schema:
            type: string
      responses:
        "200":
          description: Parsed page; the page digest is returned as the ETag
          headers:
            ETag:
              description: Quoted page digest for conditional requests
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentationPageResponse"
        "304":
          description: Unchanged page for a matching If-None-Match
        "404":
          $ref: "#/components/responses/Error"

  /documentation/tree:
    get:
      operationId: getDocumentationTree
      summary: One level of the library navigation tree (public read, lazy per section)
      tags: [documentation]
      parameters:
        - name: path
          in: query
          required: false
          description: Tree node path; omit for the top-level sections
          schema:
            type: string
      responses:
        "200":
          description: Child nodes of the requested tree level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentationTreeResponse"
        "404":
          $ref: "#/components/responses/Error"

  /documentation/asset:
    get:
      operationId: getDocumentationAsset
      summary: One static library asset verified against its pinned digest (public read)
      tags: [documentation]
      parameters:
        - name: path
          in: query
          required: true
          description: Library-relative asset path, for example docs/images/ingress.svg
          schema:
            type: string
      responses:
        "200":
          description: Asset bytes with their media type; immutable and cacheable
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

  /documentation/practice:
    post:
      operationId: startDocumentationPractice
      summary: Start the fixed Kubernetes documentation practice workflow (admin only)
      tags: [documentation]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Fixed documentation practice workflow accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentationPracticeStart"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /auth/register:
    post:
      operationId: register
      summary: Register a new user; the first registered user becomes admin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          description: Registration is disabled by configuration

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List user accounts without credentials (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All user accounts, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /admin/users/{id}/totp-reset:
    post:
      operationId: resetAdminUserTOTP
      summary: Replace a user's TOTP secret after the caller confirms their own password (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTOTPResetRequest"
      responses:
        "200":
          description: New TOTP secret, shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Login with password + TOTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /admin/audit:
    get:
      operationId: listAdminAudit
      summary: Page the append-only human action audit ledger (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: action
          in: query
          description: Filter by exact administrative action name
          schema:
            type: string
        - name: user_id
          in: query
          description: Filter by the acting user identifier
          schema:
            type: string
      responses:
        "200":
          description: One page of human actions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /admin/documentation/workflows:
    get:
      operationId: listAdminDocumentationWorkflows
      summary: List documentation workflows with dwell and stuck status (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All documentation workflows, most recently updated first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDocumentationWorkflowList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/documentation/workflows/{workflow_id}:
    get:
      operationId: getAdminDocumentationWorkflow
      summary: Inspect one documentation workflow with its ledger, Agent audits, and publication (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentWorkflowID"
      responses:
        "200":
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDocumentationWorkflowDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/documentation/workflows/{workflow_id}/force-fail:
    post:
      operationId: forceFailAdminDocumentationWorkflow
      summary: Drive a stuck documentation workflow to Failed with a required reason (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWorkflowReasonRequest"
      responses:
        "200":
          description: Workflow forced to Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDocumentationWorkflow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /admin/documentation/workflows/{workflow_id}/restart:
    post:
      operationId: restartAdminDocumentationWorkflow
      summary: Reset a failed or rejected documentation workflow to Planning with a required reason (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWorkflowReasonRequest"
      responses:
        "200":
          description: Workflow reset to Planning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDocumentationWorkflow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /admin/runnable-actions:
    get:
      operationId: listAdminRunnableActions
      summary: Observe the runnable action queue with backlog summary and flags (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          description: Filter items by queue state; the summary always covers the whole queue
          schema:
            type: string
            enum: [queued, running, completed, failed]
        - name: phase
          in: query
          description: Filter items by action phase
          schema:
            type: string
            enum: [materialize-artifact, verify]
      responses:
        "200":
          description: Queue summary and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRunnableActionPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /admin/environments:
    get:
      operationId: listAdminEnvironments
      summary: List every RuntimeEnvironment across users with lifecycle state (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All runtime environments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvironmentList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /admin/environments/{name}/release:
    post:
      operationId: releaseAdminEnvironment
      summary: Request an administrative environment release via the existing drain path (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Release requested; the controller drain path takes over
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvironmentRelease"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /admin/system:
    get:
      operationId: getAdminSystem
      summary: Server build, pinned documentation, catalog integrity, and background service registry (admin only)
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemStatus"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /me/space:
    get:
      operationId: getMySpace
      summary: Get the authenticated user's learning space
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning history, active environments, and authoring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpace"
        "401":
          $ref: "#/components/responses/Error"

  /me/space/learning:
    get:
      operationId: getMySpaceLearning
      summary: Page durable learning history for the authenticated user
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: state
          in: query
          description: Filter attempts by their current learning state
          schema:
            type: string
            enum: [active, completed, ended]
        - name: runtime
          in: query
          description: Filter attempts by environment runtime
          schema:
            type: string
            enum: [node, k8s]
      responses:
        "200":
          description: One page of learning history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpaceLearningPage"
        "401":
          $ref: "#/components/responses/Error"

  /operations/scenarios:
    get:
      operationId: listScenarios
      summary: List operations scenarios
      tags: [operations]
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioList"

  /operations/scenarios/{id}/start:
    post:
      operationId: startScenario
      summary: Start or resume a scenario environment
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "404":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/content:
    get:
      operationId: getScenarioContent
      summary: Get scenario details and any available learning aids
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioContent"
        "404":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/progress:
    get:
      operationId: getScenarioProgress
      summary: Read the controller-owned current scenario checkpoint snapshot
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current checkpoint results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioProgress"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/assistant:
    get:
      operationId: getScenarioAssistant
      summary: Read or create the assistant conversation for the active scenario environment
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment-scoped assistant conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/assistant/messages:
    post:
      operationId: sendScenarioAssistantMessage
      summary: Send a message to the active scenario assistant and receive SSE events
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "200":
          description: Server-sent assistant status, tool, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/reset:
    post:
      operationId: resetScenario
      summary: Reset scenario to initial state
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "404":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/stop:
    post:
      operationId: stopScenario
      summary: Stop the current scenario environment
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "404":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/terminal-ticket:
    post:
      operationId: createTerminalTicket
      summary: Create a one-time ticket for a terminal WebSocket
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalTicketRequest"
      responses:
        "200":
          description: Short-lived one-time terminal ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicketResponse"
        "404":
          $ref: "#/components/responses/Error"

  /operations/scenarios/{id}/terminals/{window}:
    delete:
      operationId: closeTerminalWindow
      summary: Close one terminal tab in the current scenario environment
      tags: [operations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
        - name: node
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
      responses:
        "200":
          description: Terminal window closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalWindowCloseResponse"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions:
    post:
      operationId: createAuthoringSession
      summary: Create a human-reviewed scenario authoring session
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoring session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/scenarios/{id}/revisions:
    post:
      operationId: createAuthoringScenarioRevision
      summary: Start a new authoring session for an author-owned Scenario revision
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scenario revision authoring session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /authoring/scenarios/{id}/deprecate:
    post:
      operationId: deprecateAuthoringScenario
      summary: Remove an author-owned Scenario from the active Catalog
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Scenario deprecated
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /authoring/sessions/current:
    get:
      operationId: getCurrentAuthoringSession
      summary: Resume the latest unfinished authoring session for the current user
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current unfinished authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}:
    get:
      operationId: getAuthoringSession
      summary: Read the current authoring revision, conversation, assets, and diff
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      responses:
        "200":
          description: Current authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}/messages:
    post:
      operationId: sendAuthoringMessage
      summary: Send one natural-language instruction to the authoring agent
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringMessageRequest"
      responses:
        "200":
          description: Server-sent authoring ready, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "202":
          description: The idempotency key already owns an existing authoring run; read the session to obtain its durable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringRunReceipt"
        "404":
          $ref: "#/components/responses/Error"

  /generator/plans:
    post:
      operationId: setGenerationPlan
      summary: Create or revise one user-owned generation plan
      tags: [generator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorPlanRequest"
      responses:
        "200":
          description: Persisted plan revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorPlanResponse"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows:
    get:
      operationId: listActiveGenerations
      summary: List the authenticated user's unfinished generation workflows
      tags: [generator]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unfinished generation workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflowList"
    post:
      operationId: confirmGeneration
      summary: Confirm one persisted plan revision and create its workflow
      tags: [generator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorGenerationConfirmationRequest"
      responses:
        "200":
          description: Generation workflow created or returned from its idempotency receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}:
    get:
      operationId: getGeneration
      summary: Read one user-owned workflow and its safe candidate review projection
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      responses:
        "200":
          description: Generator workflow and current candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorGeneration"
        "404":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/review-bundle:
    get:
      operationId: getGeneratorReviewBundle
      summary: Download one immutable author review bundle
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [content]
      responses:
        "200":
          description: Version-bound review manifest and deterministic tar.gz payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorReviewBundle"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/turn:
    post:
      operationId: startGeneratorWorkspaceTurn
      summary: Bind one explicit generator turn to a workflow workspace
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceTurnRequest"
      responses:
        "200":
          description: Workspace turn is bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceTurn"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/turn/end:
    post:
      operationId: endGeneratorWorkspaceTurn
      summary: Release one explicit generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceTurnRequest"
      responses:
        "204":
          description: Workspace turn released
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/files:
    get:
      operationId: listGeneratorWorkspaceFiles
      summary: List files in one bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
        - $ref: "#/components/parameters/GeneratorTurnID"
      responses:
        "200":
          description: Safe relative workspace file entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceFileList"
        "409":
          $ref: "#/components/responses/Error"
    put:
      operationId: writeGeneratorWorkspaceFile
      summary: Write one relative file in a bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceFileWriteRequest"
      responses:
        "204":
          description: Workspace file written
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/file:
    get:
      operationId: readGeneratorWorkspaceFile
      summary: Read a relative file from one bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
        - $ref: "#/components/parameters/GeneratorTurnID"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Selected workspace file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceFileRead"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/commands:
    post:
      operationId: runGeneratorWorkspaceCommand
      summary: Run one command inside a bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceCommandRequest"
      responses:
        "200":
          description: Command exit code and output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceCommandResult"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/candidate:
    post:
      operationId: submitGeneratorCandidate
      summary: Submit the archive from one bound workspace turn as an immutable candidate
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorCandidateSubmissionRequest"
      responses:
        "200":
          description: Candidate submission accepted or returned from its idempotency receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorGeneration"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/content/confirm:
    post:
      operationId: confirmGeneratorContent
      summary: Confirm a verified candidate and begin publication
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorContentConfirmationRequest"
      responses:
        "200":
          description: Workflow advanced to scenario publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/content/changes:
    post:
      operationId: requestGeneratorContentChanges
      summary: Return a reviewed candidate to generating with user feedback
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorContentChangeRequest"
      responses:
        "200":
          description: Workflow returned to generating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel one unfinished generation workflow
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorCancellationRequest"
      responses:
        "200":
          description: Workflow cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    AuthoringSessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    DocumentWorkflowID:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    GeneratorWorkflowID:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    GeneratorTurnID:
      name: turn_id
      in: query
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DocumentationAnchor:
      type: object
      required: [id, level, title]
      properties:
        id:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 6
        title:
          type: string

    DocumentationAsset:
      type: object
      required: [path, digest]
      properties:
        path:
          type: string
        digest:
          type: string

    DocumentationPageResponse:
      type: object
      required: [path, page_kind, title, digest, markdown, anchors, assets]
      properties:
        path:
          type: string
        page_kind:
          type: string
          description: Library page kind, for example content or index
        title:
          type: string
        digest:
          type: string
          description: sha256 of the parsed markdown bytes
        markdown:
          type: string
          description: Offline-parsed markdown with page-relative image references rewritten to the asset endpoint
        anchors:
          type: array
          items:
            $ref: "#/components/schemas/DocumentationAnchor"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/DocumentationAsset"

    DocumentationTreeNode:
      type: object
      required: [title, path, has_children]
      properties:
        title:
          type: string
        path:
          type: string
        has_children:
          type: boolean

    DocumentationTreeResponse:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/DocumentationTreeNode"

    DocumentationPracticeStart:
      type: object
      required: [workflow_id, state]
      properties:
        workflow_id:
          type: string
        state:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 6

    RegisterResponse:
      type: object
      required: [totp_secret, totp_url]
      properties:
        totp_secret:
          type: string
        totp_url:
          type: string

    AdminUser:
      type: object
      required: [id, subject, name, role, created_at]
      properties:
        id:
          type: string
        subject:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"

    AdminTOTPResetRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: The calling admin's own password, confirmed before the target's secret is replaced

    AdminHumanAction:
      type: object
      required: [id, user_id, action, target_type, target_id, detail, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
          description: The acting user
        action:
          type: string
          enum: [documentation.practice.start, documentation.workflow.force_fail, documentation.workflow.restart, user.totp.reset, environment.release]
        target_type:
          type: string
        target_id:
          type: string
        detail:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AdminAuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminHumanAction"
        next_cursor:
          type: string
          description: Present when another page exists

    AdminDocumentationWorkflowStuck:
      type: object
      required: [flag]
      properties:
        flag:
          type: boolean
        reason:
          type: string
          enum: [action_failed, attempts_exhausted, dwell_timeout]
        failure_class:
          type: string
        failure_code:
          type: string
        failure_summary:
          type: string

    AdminDocumentationWorkflow:
      type: object
      required: [id, state, state_version, revision, updated_at, dwell_seconds, stuck]
      properties:
        id:
          type: string
        state:
          type: string
        state_version:
          type: integer
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
          description: State entry time; dwell_seconds is measured from it
        dwell_seconds:
          type: integer
        stuck:
          $ref: "#/components/schemas/AdminDocumentationWorkflowStuck"

    AdminDocumentationWorkflowList:
      type: object
      required: [workflows]
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/AdminDocumentationWorkflow"

    AdminDocumentationLedgerEntry:
      type: object
      required: [id, kind, content_revision, digest, schema_version, owner_role, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
        parent_id:
          type: string
        content_revision:
          type: string
        digest:
          type: string
        schema_version:
          type: string
        owner_role:
          type: string
        policy_version:
          type: string
        created_at:
          type: string
          format: date-time

    AdminDocumentationAgentAudit:
      type: object
      required: [run_id, role, model, prompt_version, tool_version, policy_version, input_digest, output_digest, created_at]
      properties:
        run_id:
          type: string
        role:
          type: string
        model:
          type: string
        prompt_version:
          type: string
        tool_version:
          type: string
        policy_version:
          type: string
        input_digest:
          type: string
        output_digest:
          type: string
        created_at:
          type: string
          format: date-time

    AdminDocumentationPublication:
      type: object
      required: [id, manifest, manifest_digest, created_at]
      properties:
        id:
          type: string
        manifest:
          type: object
          additionalProperties: true
        manifest_digest:
          type: string
        created_at:
          type: string
          format: date-time

    AdminDocumentationWorkflowDetail:
      type: object
      required: [id, state, state_version, revision, updated_at, dwell_seconds, stuck, ledger, agent_audits]
      properties:
        id:
          type: string
        state:
          type: string
        state_version:
          type: integer
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
        dwell_seconds:
          type: integer
        stuck:
          $ref: "#/components/schemas/AdminDocumentationWorkflowStuck"
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/AdminDocumentationLedgerEntry"
        agent_audits:
          type: array
          items:
            $ref: "#/components/schemas/AdminDocumentationAgentAudit"
        publication:
          $ref: "#/components/schemas/AdminDocumentationPublication"

    AdminWorkflowReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminRunnableActionSummary:
      type: object
      required: [by_state, by_attempt]
      properties:
        by_state:
          type: object
          description: Queue counts keyed by state
          additionalProperties:
            type: integer
        by_attempt:
          type: object
          description: Queue counts keyed by retry attempt
          additionalProperties:
            type: integer

    AdminRunnableActionItem:
      type: object
      required: [action_key, content_kind, content_id, content_revision, phase, state, attempt, next_run_at, failure_class, failure_code, failure_summary, flag]
      properties:
        action_key:
          type: string
        content_kind:
          type: string
        content_id:
          type: string
        content_revision:
          type: string
        phase:
          type: string
        state:
          type: string
        attempt:
          type: integer
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
        failure_class:
          type: string
        failure_code:
          type: string
        failure_summary:
          type: string
        document_workflow_id:
          type: string
          nullable: true
          description: Present only for actions bound to a documentation workflow
        reconciled:
          type: string
          format: date-time
          nullable: true
          description: When the documentation product acknowledged the result
        flag:
          type: string
          enum: [attempt-high, failed-unreconciled, ""]

    AdminRunnableActionPage:
      type: object
      required: [summary, items]
      properties:
        summary:
          $ref: "#/components/schemas/AdminRunnableActionSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRunnableActionItem"

    AdminEnvironment:
      type: object
      required: [name, namespace, phase, purpose, created_at]
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
          description: Controller phase, e.g. Pending, Ready, Draining, Failed, Released
        purpose:
          type: string
          enum: [learning, verification]
        user:
          type: string
          description: Owning user identifier from the environment labels
        content_kind:
          type: string
        content_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Controller-projected lifecycle expiry
        failure:
          $ref: "#/components/schemas/AdminEnvironmentFailure"

    AdminEnvironmentFailure:
      type: object
      required: [class, component, reason, at]
      properties:
        class:
          type: string
          enum: [artifact, infrastructure]
        component:
          type: string
        reason:
          type: string
        message:
          type: string
        at:
          type: string
          format: date-time

    AdminEnvironmentList:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          items:
            $ref: "#/components/schemas/AdminEnvironment"

    AdminEnvironmentRelease:
      type: object
      required: [id, phase]
      properties:
        id:
          type: string
        phase:
          type: string

    AdminBackgroundService:
      type: object
      required: [name, started_at, last_error]
      properties:
        name:
          type: string
        started_at:
          type: string
          format: date-time
        last_tick_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string

    AdminCatalogIntegrity:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, failed]
        detail:
          type: string
          description: When failed, the integrity error including the offending revision

    AdminDocumentationDeployment:
      type: object
      required: [source_id, repository, revision, version, language, page_path, anchor]
      properties:
        source_id:
          type: string
        repository:
          type: string
        revision:
          type: string
        version:
          type: string
        language:
          type: string
        page_path:
          type: string
        anchor:
          type: string
        parser_version:
          type: string
          nullable: true
          description: Offline library generator_version; absent on the legacy rendered-snapshot path
        upstream_commit:
          type: string
          nullable: true
          description: Upstream commit pinned inside the library manifest

    AdminSystemStatus:
      type: object
      required: [version, commit, build_time, catalog_integrity, services]
      properties:
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        catalog_release_reference:
          type: string
          nullable: true
        catalog_integrity:
          $ref: "#/components/schemas/AdminCatalogIntegrity"
        documentation:
          $ref: "#/components/schemas/AdminDocumentationDeployment"
        services:
          type: array
          items:
            $ref: "#/components/schemas/AdminBackgroundService"

    LoginRequest:
      type: object
      required: [username, password, totp_code]
      properties:
        username:
          type: string
        password:
          type: string
        totp_code:
          type: string

    LoginResponse:
      type: object
      required: [token, user_id, name]
      properties:
        token:
          type: string
          description: JWT access token
        user_id:
          type: string
        name:
          type: string

    MySpaceScenario:
      type: object
      required: [id, title, runtime, content_source]
      properties:
        id:
          type: string
        title:
          type: string
        runtime:
          type: string
          enum: [node, k8s]
        content_source:
          type: string
          enum: [operations, documentation]
    MySpaceProfile:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    MySpaceEnvironmentQuota:
      type: object
      required: [occupied, maximum]
      properties:
        occupied:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
          nullable: true

    MySpaceSummary:
      type: object
      required: [completed_count, attempted_count, in_progress_environment_count, terminal_learning_seconds, authoring_count, published_count, environment_quota]
      properties:
        completed_count:
          type: integer
          minimum: 0
        attempted_count:
          type: integer
          minimum: 0
        in_progress_environment_count:
          type: integer
          minimum: 0
        terminal_learning_seconds:
          type: integer
          minimum: 0
        authoring_count:
          type: integer
          minimum: 0
        published_count:
          type: integer
          minimum: 0
        environment_quota:
          $ref: "#/components/schemas/MySpaceEnvironmentQuota"

    MySpaceActiveEnvironment:
      type: object
      required: [environment_id, scenario, runtime, phase, checkpoint_progress]
      properties:
        environment_id:
          type: string
        scenario:
          $ref: "#/components/schemas/MySpaceScenario"
        runtime:
          type: string
          enum: [node, k8s]
        phase:
          type: string
        checkpoint_progress:
          $ref: "#/components/schemas/CheckpointProgressSummary"
        expires_at:
          type: string
          format: date-time
          nullable: true

    MySpaceLearningHistory:
      type: object
      required: [scenario, ready_at, learning_seconds, state, checkpoint_first_passes]
      properties:
        scenario:
          $ref: "#/components/schemas/MySpaceScenario"
        ready_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        learning_seconds:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [active, completed, stopped, reset, expired]
        checkpoint_first_passes:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointFirstPass"

    MySpaceLearningPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceLearningHistory"
        next_cursor:
          type: string
          nullable: true

    MySpaceAuthoringDraft:
      type: object
      required: [session_id, title, state, updated_at]
      properties:
        session_id:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [DraftConversation, IntentReview]
        updated_at:
          type: string
          format: date-time

    MySpacePublishedScenario:
      type: object
      required: [scenario, revision_id, state, published_at, attempted_users, completed_users]
      properties:
        scenario:
          $ref: "#/components/schemas/MySpaceScenario"
        revision_id:
          type: string
        state:
          type: string
          enum: [active, deprecated]
        published_at:
          type: string
          format: date-time
        attempted_users:
          type: integer
          minimum: 0
        completed_users:
          type: integer
          minimum: 0
        pass_rate:
          type: number
          format: float
          nullable: true

    MySpaceAuthoring:
      type: object
      required: [drafts, published]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceAuthoringDraft"
        published:
          type: array
          items:
            $ref: "#/components/schemas/MySpacePublishedScenario"

    MySpace:
      type: object
      required: [profile, summary, active_environments, recent_learning, recent_learning_next_cursor, authoring]
      properties:
        profile:
          $ref: "#/components/schemas/MySpaceProfile"
        summary:
          $ref: "#/components/schemas/MySpaceSummary"
        active_environments:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceActiveEnvironment"
        recent_learning:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceLearningHistory"
        recent_learning_next_cursor:
          type: string
          nullable: true
        authoring:
          $ref: "#/components/schemas/MySpaceAuthoring"

    ScenarioSummary:
      type: object
      required: [id, title, runtime, scenario_tags, description, published_at]
