          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
    AssistantTerminalContext:
      type: object
      required: [windows]
      properties:
        node:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        windows:
          type: array
          items:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"

    AssistantMessageRequest:
      type: object
      required: [content, current_window, terminals]
      properties:
        content:
          type: string
        current_node:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        current_window:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/AssistantTerminalContext"

    StartResponse:
      type: object
      required: [scenario_title]
      properties:
        scenario_title:
          type: string

    ResetResponse:
      type: object
      required: [scenario_title]
      properties:
        scenario_title:
          type: string
    StopResponse:
      type: object
      required: [stopped, scenario_title]
      properties:
        stopped:
          type: boolean
        scenario_title:
          type: string

    TerminalWindowCloseResponse:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean

    TerminalTicketRequest:
      type: object
      required: [window]
      properties:
        window:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        node:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"

    TerminalTicketResponse:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string

    AuthoringMetadata:
      type: object
      required:
        - title
        - description
        - runtime
      properties:
        title:
          type: string
        description:
          type: string
        runtime:
          type: string
          enum: [node, k8s]

    AuthoringCheckpoint:
      type: object
      required: [id, title, markdown, position]
      properties:
        id:
          type: string
        title:
