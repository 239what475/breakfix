        revision_scenario_id:
          type: string
        revision_base_active_revision_id:
          type: string
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/GeneratorWorkflow"
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time
        intent:
