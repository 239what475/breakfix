      type: object
      required: [id, archive_digest, content_revision]
      properties:
        id:
          type: string
        archive_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        content_revision:
          type: string
        failure:
          $ref: "#/components/schemas/AuthoringCandidateFailure"

    AuthoringCandidateFailure:
      type: object
      required: [class, code, summary]
      properties:
        class:
          type: string
          enum: [artifact, infrastructure, cancelled]
        code:
          type: string
        summary:
          type: string

    GeneratorWorkflow:
      type: object
      required: [id, session_id, plan_revision, state, state_version, created_at, updated_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        plan_revision:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum: [Generating, Judging, MaterializingArtifact, Verifying, NeedsAuthorReview, Publishing, Published, Failed, Cancelled]
        state_version:
          type: integer
          format: int64
          minimum: 1
        candidate_revision_id:
          type: string
        last_error:
          type: string
          nullable: true
        finalizer_error_category:
          type: string
          enum: [deterministic, transient]
          nullable: true
        finalizer_last_error:
          type: string
          nullable: true
        finalizer_last_attempted_at:
          type: string
          format: date-time
          nullable: true
        finalizer_next_retry_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthoringChange:
      type: object
      required: [kind, summary, revision]
      properties:
        kind:
          type: string
        summary:
          type: string
        revision:
          type: integer

    AuthoringMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
