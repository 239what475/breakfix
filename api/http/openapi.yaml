      required: [kind, label]
      properties:
        kind:
          type: string
        label:
          type: string

    AssistantMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AssistantEvidence"
        created_at:
          type: string

    AssistantConversation:
      type: object
      required: [id, scenario_id, messages]
      properties:
        id:
          type: string
