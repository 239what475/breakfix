openapi: "3.0.3"
info:
  title: Breakfix API
  version: "1.0.0"
  description: SRE/DevOps interview practice platform
servers:
  - url: http://localhost:9090/api
    description: Local dev

paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Login with password + TOTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /me/space:
    get:
      operationId: getMySpace
      summary: Get the authenticated user's learning space
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning history, active environments, and authoring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpace"
        "401":
          $ref: "#/components/responses/Error"

  /me/space/learning:
    get:
      operationId: getMySpaceLearning
      summary: Page durable learning history for the authenticated user
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: state
          in: query
          description: Filter attempts by their current learning state
          schema:
            type: string
            enum: [active, completed, ended]
        - name: runtime
          in: query
          description: Filter attempts by environment runtime
          schema:
            type: string
            enum: [node, k8s]
      responses:
        "200":
          description: One page of learning history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpaceLearningPage"
        "401":
          $ref: "#/components/responses/Error"

  /challenges:
    get:
      operationId: listChallenges
      summary: List all challenges
      tags: [challenges]
      responses:
        "200":
          description: Challenge list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeList"

  /challenges/{id}/start:
    post:
      operationId: startChallenge
      summary: Start or resume a challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/content:
    get:
      operationId: getChallengeContent
      summary: Get challenge problem, solution, hints, and checkpoint metadata
      tags: [challenges]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeContent"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/progress:
    get:
      operationId: getChallengeProgress
      summary: Read the controller-owned current challenge checkpoint snapshot
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current checkpoint results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgress"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant:
    get:
      operationId: getChallengeAssistant
      summary: Read or create the assistant conversation for the active challenge environment
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment-scoped assistant conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant/messages:
    post:
      operationId: sendChallengeAssistantMessage
      summary: Send a message to the active challenge assistant and receive SSE events
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "200":
          description: Server-sent assistant status, tool, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/reset:
    post:
      operationId: resetChallenge
      summary: Reset challenge to initial state
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/stop:
    post:
      operationId: stopChallenge
      summary: Stop the current challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/terminal-ticket:
    post:
      operationId: createTerminalTicket
      summary: Create a one-time ticket for a terminal WebSocket
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalTicketRequest"
      responses:
        "200":
          description: Short-lived one-time terminal ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicketResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/terminals/{window}:
    delete:
      operationId: closeTerminalWindow
      summary: Close one terminal tab in the current challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
        - name: node
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
      responses:
        "200":
          description: Terminal window closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalWindowCloseResponse"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions:
    post:
      operationId: createAuthoringSession
      summary: Create a human-reviewed challenge authoring session
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoring session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/sessions/current:
    get:
      operationId: getCurrentAuthoringSession
      summary: Resume the latest unfinished authoring session for the current user
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current unfinished authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}:
    get:
      operationId: getAuthoringSession
      summary: Read the current authoring revision, conversation, assets, and diff
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      responses:
        "200":
          description: Current authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}/messages:
    post:
      operationId: sendAuthoringMessage
      summary: Send one natural-language instruction to the authoring agent
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringMessageRequest"
      responses:
        "200":
          description: Server-sent authoring ready, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}/generate:
    post:
      operationId: confirmAuthoringGeneration
      summary: Explicitly start generation and real verification for the current intent revision
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringGenerationRequest"
      responses:
        "200":
          description: Generator Run and verification started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/sessions/{id}/classify:
    post:
      operationId: confirmAuthoringContent
      summary: Freeze the verified candidate and start its private classification review
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringContentConfirmationRequest"
      responses:
        "200":
          description: Verified revision entered classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/sessions/{id}/publish:
    post:
      operationId: publishAuthoringRevision
      summary: Explicitly publish the current verified authoring revision
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringClassificationPublicationRequest"
      responses:
        "200":
          description: Verified revision published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    AuthoringSessionID:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 6

    RegisterResponse:
      type: object
      required: [totp_secret, totp_url]
      properties:
        totp_secret:
          type: string
        totp_url:
          type: string

    LoginRequest:
      type: object
      required: [username, password, totp_code]
      properties:
        username:
          type: string
        password:
          type: string
        totp_code:
          type: string

    LoginResponse:
      type: object
      required: [token, user_id, name]
      properties:
        token:
          type: string
          description: JWT access token
        user_id:
          type: string
        name:
          type: string

    MySpaceChallenge:
      type: object
      required: [id, title, runtime, difficulty]
      properties:
        id:
          type: string
        title:
          type: string
        runtime:
          type: string
          enum: [node, k8s]
        difficulty:
          type: string

    MySpaceProfile:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    MySpaceEnvironmentQuota:
      type: object
      required: [occupied, maximum]
      properties:
        occupied:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
          nullable: true

    MySpaceSummary:
      type: object
      required: [completed_count, attempted_count, in_progress_environment_count, terminal_learning_seconds, authoring_count, published_count, environment_quota]
      properties:
        completed_count:
          type: integer
          minimum: 0
        attempted_count:
          type: integer
          minimum: 0
        in_progress_environment_count:
          type: integer
          minimum: 0
        terminal_learning_seconds:
          type: integer
          minimum: 0
        authoring_count:
          type: integer
          minimum: 0
        published_count:
          type: integer
          minimum: 0
        environment_quota:
          $ref: "#/components/schemas/MySpaceEnvironmentQuota"

    MySpaceActiveEnvironment:
      type: object
      required: [environment_id, challenge, runtime, phase, checkpoint_progress]
      properties:
        environment_id:
          type: string
        challenge:
          $ref: "#/components/schemas/MySpaceChallenge"
        runtime:
          type: string
          enum: [node, k8s]
        phase:
          type: string
        checkpoint_progress:
          $ref: "#/components/schemas/CheckpointProgressSummary"
        expires_at:
          type: string
          format: date-time
          nullable: true

    MySpaceLearningHistory:
      type: object
      required: [challenge, ready_at, learning_seconds, state, checkpoint_first_passes]
      properties:
        challenge:
          $ref: "#/components/schemas/MySpaceChallenge"
        ready_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        learning_seconds:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [active, completed, stopped, reset, expired]
        checkpoint_first_passes:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointFirstPass"

    MySpaceLearningPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceLearningHistory"
        next_cursor:
          type: string
          nullable: true

    MySpaceAuthoringDraft:
      type: object
      required: [session_id, title, state, updated_at]
      properties:
        session_id:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [DraftConversation, IntentReview]
        workflow_state:
          type: string
          enum: [Generating, Judging, Building, ArtifactPublishing, Verifying, NeedsAuthorReview, Classifying, NeedsClassificationReview, ChallengePublishing, Published, Failed, Cancelled, Superseded]
        updated_at:
          type: string
          format: date-time

    MySpacePublishedChallenge:
      type: object
      required: [challenge, published_at, attempted_users, completed_users]
      properties:
        challenge:
          $ref: "#/components/schemas/MySpaceChallenge"
        published_at:
          type: string
          format: date-time
        attempted_users:
          type: integer
          minimum: 0
        completed_users:
          type: integer
          minimum: 0
        pass_rate:
          type: number
          format: float
          nullable: true

    MySpaceAuthoring:
      type: object
      required: [drafts, published]
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceAuthoringDraft"
        published:
          type: array
          items:
            $ref: "#/components/schemas/MySpacePublishedChallenge"

    MySpace:
      type: object
      required: [profile, summary, active_environments, recent_learning, recent_learning_next_cursor, authoring]
      properties:
        profile:
          $ref: "#/components/schemas/MySpaceProfile"
        summary:
          $ref: "#/components/schemas/MySpaceSummary"
        active_environments:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceActiveEnvironment"
        recent_learning:
          type: array
          items:
            $ref: "#/components/schemas/MySpaceLearningHistory"
        recent_learning_next_cursor:
          type: string
          nullable: true
        authoring:
          $ref: "#/components/schemas/MySpaceAuthoring"

    ChallengeSummary:
      type: object
      required: [id, title, runtime, difficulty, domain, topic, tags, description, published_at]
      properties:
        id:
          type: string
        title:
          type: string
        runtime:
          type: string
          enum: [node, k8s]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        domain:
          $ref: "#/components/schemas/RoadmapReference"
        topic:
          $ref: "#/components/schemas/RoadmapReference"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapReference"
        description:
          type: string
        published_at:
          type: string
          format: date-time
        solved:
          type: boolean
        active:
          type: boolean
        progress:
          $ref: "#/components/schemas/CheckpointProgressSummary"

    CheckpointProgressSummary:
      type: object
      required: [passed, total]
      properties:
        passed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    ChallengeList:
      type: object
      required: [challenges]
      properties:
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeSummary"

    RoadmapReference:
      type: object
      required: [id, source_ref, title]
      properties:
        id:
          type: string
        source_ref:
          type: string
        title:
          type: string

    RoadmapDomain:
      type: object
      required: [id, source_ref, title, definition, scope, non_goals]
      properties:
        id:
          type: string
        source_ref:
          type: string
        title:
          type: string
        definition:
          type: string
        scope:
          type: string
        non_goals:
          type: string

    RoadmapTopic:
      type: object
      required: [id, source_ref, title, domain, definition, scope, non_goals, challenge_guidance]
      properties:
        id:
          type: string
        source_ref:
          type: string
        title:
          type: string
        domain:
          $ref: "#/components/schemas/RoadmapReference"
        definition:
          type: string
        scope:
          type: string
        non_goals:
          type: string
        challenge_guidance:
          type: string

    RoadmapTag:
      type: object
      required: [id, source_ref, title, description]
      properties:
        id:
          type: string
        source_ref:
          type: string
        title:
          type: string
        description:
          type: string

    RoadmapEdge:
      type: object
      required: [source, target, relation, reason]
      properties:
        source:
          $ref: "#/components/schemas/RoadmapReference"
        target:
          $ref: "#/components/schemas/RoadmapReference"
        relation:
          type: string
          enum: [precedes, related]
        reason:
          type: string

    ChallengeRoadmap:
      type: object
      required: [revision, domain, topic, tags, topic_neighbors, challenge_neighbors]
      properties:
        revision:
          type: string
        domain:
          $ref: "#/components/schemas/RoadmapReference"
        topic:
          $ref: "#/components/schemas/RoadmapTopic"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapTag"
        topic_neighbors:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapEdge"
        challenge_neighbors:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapEdge"

    ChallengeCheckpoint:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        hint:
          type: string
        node:
          type: string

    ChallengeNode:
      type: object
      required: [name, title]
      properties:
        name:
          type: string
        title:
          type: string

    CheckpointResult:
      type: object
      required: [id, passed, summary]
      properties:
        id:
          type: string
        passed:
          type: boolean
        first_passed_at:
          type: string
          format: date-time
          nullable: true
        summary:
          type: string
        details:
          type: string

    CheckpointFirstPass:
      type: object
      required: [checkpoint_id, first_passed_at, summary]
      properties:
        checkpoint_id:
          type: string
        first_passed_at:
          type: string
          format: date-time
        summary:
          type: string

    ChallengeContent:
      type: object
      required: [id, title, runtime, nodes, problem, solution, hints, checkpoints, roadmap]
      properties:
        id:
          type: string
        title:
          type: string
        runtime:
          type: string
          enum: [node, k8s]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeNode"
        problem:
          type: string
        solution:
          type: string
        hints:
          type: object
          additionalProperties:
            type: string
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeCheckpoint"
        roadmap:
          $ref: "#/components/schemas/ChallengeRoadmap"

    ChallengeProgress:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckpointResult"

    AssistantEvidence:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
        label:
          type: string

    AssistantMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AssistantEvidence"
        created_at:
          type: string

    AssistantConversation:
      type: object
      required: [id, challenge_id, messages]
      properties:
        id:
          type: string
        challenge_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
    AssistantTerminalContext:
      type: object
      required: [windows]
      properties:
        node:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        windows:
          type: array
          items:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"

    AssistantMessageRequest:
      type: object
      required: [content, current_window, terminals]
      properties:
        content:
          type: string
        current_node:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        current_window:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/AssistantTerminalContext"

    StartResponse:
      type: object
      required: [challenge_title]
      properties:
        challenge_title:
          type: string

    ResetResponse:
      type: object
      required: [challenge_title]
      properties:
        challenge_title:
          type: string
    StopResponse:
      type: object
      required: [stopped, challenge_title]
      properties:
        stopped:
          type: boolean
        challenge_title:
          type: string

    TerminalWindowCloseResponse:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean

    TerminalTicketRequest:
      type: object
      required: [window]
      properties:
        window:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
        node:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"

    TerminalTicketResponse:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string

    AuthoringMetadata:
      type: object
      required:
        - title
        - difficulty
        - description
        - runtime
      properties:
        title:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        description:
          type: string
        runtime:
          type: string
          enum: [node, k8s]

    AuthoringCheckpoint:
      type: object
      required: [id, title, markdown, position]
      properties:
        id:
          type: string
        title:
          type: string
        markdown:
          type: string
        position:
          type: integer

    AuthoringPlan:
      type: object
      required: [metadata, overview, checkpoints]
      properties:
        metadata:
          $ref: "#/components/schemas/AuthoringMetadata"
        overview:
          type: string
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringCheckpoint"

    VerifiedCheckpoint:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        hint:
          type: string
        node:
          type: string

    VerifiedChallenge:
      type: object
      required: [metadata, checkpoints]
      properties:
        metadata:
          $ref: "#/components/schemas/AuthoringMetadata"
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/VerifiedCheckpoint"

    AuthoringCandidate:
      type: object
      required: [id, generator_run_id, archive_sha256]
      properties:
        id:
          type: string
        generator_run_id:
          type: string
        archive_sha256:
          type: string

    AuthoringGenerationWorkflow:
      type: object
      required: [id, state, state_attempt, created_at, updated_at]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [Generating, Judging, Building, ArtifactPublishing, Verifying, NeedsAuthorReview, Classifying, NeedsClassificationReview, ChallengePublishing, Published, Failed, Cancelled, Superseded]
        state_attempt:
          type: integer
          minimum: 0
        candidate_revision_id:
          type: string
        classification_roadmap_revision:
          type: string
        deadline_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthoringVerificationReport:
      type: object
      required: [passed, answers, checkpoints, summary]
      properties:
        passed:
          type: boolean
        summary:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringExecutionResult"
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringCheckpointResult"

    AuthoringExecutionResult:
      type: object
      required: [location, exit_code]
      properties:
        location:
          type: string
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string

    AuthoringCheckpointResult:
      type: object
      required: [id, passed, summary]
      properties:
        id:
          type: string
        passed:
          type: boolean
        summary:
          type: string
        details:
          type: string

    AuthoringChange:
      type: object
      required: [kind, summary, difficulty_impact, revision]
      properties:
        kind:
          type: string
        summary:
          type: string
        difficulty_impact:
          type: string
        revision:
          type: integer

    AuthoringMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, agent, system, event]
        content:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringChange"
        created_at:
          type: string
          format: date-time

    AuthoringAsset:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string

    AuthoringFileDiff:
      type: object
      required: [path, diff]
      properties:
        path:
          type: string
        diff:
          type: string

    AuthoringMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    AuthoringGenerationRequest:
      type: object
      required: [plan_revision, idempotency_key]
      properties:
        plan_revision:
          type: integer
          minimum: 0
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200

    AuthoringContentConfirmationRequest:
      type: object
      required: [workflow_id, candidate_revision_id, idempotency_key]
      properties:
        workflow_id:
          type: string
        candidate_revision_id:
          type: string
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200

    AuthoringClassificationPublicationRequest:
      type: object
      required: [workflow_id, candidate_revision_id, proposal_revision, idempotency_key]
      properties:
        workflow_id:
          type: string
        candidate_revision_id:
          type: string
        proposal_revision:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200

    AuthoringClassificationNewTopic:
      type: object
      required: [domain, title, definition, scope, non_goals, challenge_guidance]
      properties:
        domain:
          $ref: "#/components/schemas/RoadmapReference"
        title:
          type: string
        definition:
          type: string
        scope:
          type: string
        non_goals:
          type: string
        challenge_guidance:
          type: string

    AuthoringClassificationTopic:
      type: object
      required: [reason]
      properties:
        existing:
          $ref: "#/components/schemas/RoadmapReference"
        new:
          $ref: "#/components/schemas/AuthoringClassificationNewTopic"
        reason:
          type: string

    AuthoringClassificationNewTag:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string

    AuthoringClassificationTag:
      type: object
      required: [reason]
      properties:
        existing:
          $ref: "#/components/schemas/RoadmapReference"
        new:
          $ref: "#/components/schemas/AuthoringClassificationNewTag"
        reason:
          type: string

    AuthoringClassificationProposal:
      type: object
      required: [revision, candidate_revision_id, roadmap_revision, result, tags, updated_at]
      properties:
        revision:
          type: integer
          minimum: 1
        candidate_revision_id:
          type: string
        roadmap_revision:
          type: string
        result:
          type: string
          enum: [proposed, unclassifiable]
        topic:
          $ref: "#/components/schemas/AuthoringClassificationTopic"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringClassificationTag"
        unclassifiable_reason:
          type: string
        adjustment_suggestion:
          type: string
        updated_at:
          type: string
          format: date-time

    AuthoringSession:
      type: object
      required: [id, state, authoring_turn_active, intent_revision, visible_revision, updated_at, intent, messages, assets, diff]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [DraftConversation, IntentReview, Published]
        authoring_turn_active:
          type: boolean
          description: Whether the durable authoring Agent Run is pending or running. While true, the plan is being updated privately and author actions are unavailable.
        intent_revision:
          type: integer
        visible_revision:
          type: integer
        publish_challenge_id:
          type: string
        workflow:
          $ref: "#/components/schemas/AuthoringGenerationWorkflow"
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time
        intent:
          $ref: "#/components/schemas/AuthoringPlan"
        candidate:
          $ref: "#/components/schemas/AuthoringCandidate"
        verified:
          $ref: "#/components/schemas/VerifiedChallenge"
        verification:
          $ref: "#/components/schemas/AuthoringVerificationReport"
        classification:
          $ref: "#/components/schemas/AuthoringClassificationProposal"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringMessage"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringAsset"
        diff:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringFileDiff"
