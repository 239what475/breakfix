          type: string
        result:
          type: string
          enum: [proposed, unclassifiable]
        topic:
          $ref: "#/components/schemas/AuthoringClassificationTopic"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringClassificationTag"
        unclassifiable_reason:
          type: string
        adjustment_suggestion:
          type: string
        updated_at:
          type: string
          format: date-time

    AuthoringSession:
      type: object
      required: [id, state, authoring_turn_active, intent_revision, visible_revision, updated_at, intent, messages, workflows]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [DraftConversation, IntentReview, Published]
        authoring_turn_active:
          type: boolean
          description: Whether the durable authoring Agent Run is pending or running. While true, the plan is being updated privately and author actions are unavailable.
        intent_revision:
          type: integer
        visible_revision:
          type: integer
        publish_challenge_id:
          type: string
        revision_challenge_id:
          type: string
        revision_base_active_revision_id:
          type: string
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/GeneratorWorkflow"
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time
        intent:
          $ref: "#/components/schemas/AuthoringPlan"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringMessage"
