openapi: "3.0.3"
info:
  title: Breakfix API
  version: "1.0.0"
  description: SRE/DevOps interview practice platform
servers:
  - url: http://localhost:9090/api
    description: Local dev

paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Login with password + TOTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"

  /me/space:
    get:
      operationId: getMySpace
      summary: Get the authenticated user's learning space
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning history, active environments, and authoring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpace"
        "401":
          $ref: "#/components/responses/Error"

  /me/space/learning:
    get:
      operationId: getMySpaceLearning
      summary: Page durable learning history for the authenticated user
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: state
          in: query
          description: Filter attempts by their current learning state
          schema:
            type: string
            enum: [active, completed, ended]
        - name: runtime
          in: query
          description: Filter attempts by environment runtime
          schema:
            type: string
            enum: [node, k8s]
      responses:
        "200":
          description: One page of learning history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySpaceLearningPage"
        "401":
          $ref: "#/components/responses/Error"

  /challenges:
    get:
      operationId: listChallenges
      summary: List all challenges
      tags: [challenges]
      responses:
        "200":
          description: Challenge list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeList"

  /challenges/{id}/start:
    post:
      operationId: startChallenge
      summary: Start or resume a challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/content:
    get:
      operationId: getChallengeContent
      summary: Get challenge problem, solution, hints, and checkpoint metadata
      tags: [challenges]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeContent"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/progress:
    get:
      operationId: getChallengeProgress
      summary: Read the controller-owned current challenge checkpoint snapshot
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current checkpoint results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgress"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant:
    get:
      operationId: getChallengeAssistant
      summary: Read or create the assistant conversation for the active challenge environment
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Environment-scoped assistant conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/assistant/messages:
    post:
      operationId: sendChallengeAssistantMessage
      summary: Send a message to the active challenge assistant and receive SSE events
      tags: [assistant]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "200":
          description: Server-sent assistant status, tool, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /challenges/{id}/reset:
    post:
      operationId: resetChallenge
      summary: Reset challenge to initial state
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/stop:
    post:
      operationId: stopChallenge
      summary: Stop the current challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/terminal-ticket:
    post:
      operationId: createTerminalTicket
      summary: Create a one-time ticket for a terminal WebSocket
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalTicketRequest"
      responses:
        "200":
          description: Short-lived one-time terminal ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicketResponse"
        "404":
          $ref: "#/components/responses/Error"

  /challenges/{id}/terminals/{window}:
    delete:
      operationId: closeTerminalWindow
      summary: Close one terminal tab in the current challenge environment
      tags: [environments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
        - name: node
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,31}$"
      responses:
        "200":
          description: Terminal window closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalWindowCloseResponse"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions:
    post:
      operationId: createAuthoringSession
      summary: Create a human-reviewed challenge authoring session
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoring session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"

  /authoring/challenges/{id}/revisions:
    post:
      operationId: createAuthoringChallengeRevision
      summary: Start a new authoring session for an author-owned Challenge revision
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge revision authoring session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /authoring/challenges/{id}/deprecate:
    post:
      operationId: deprecateAuthoringChallenge
      summary: Remove an author-owned Challenge from the active Catalog
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Challenge deprecated
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /authoring/sessions/current:
    get:
      operationId: getCurrentAuthoringSession
      summary: Resume the latest unfinished authoring session for the current user
      tags: [authoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current unfinished authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}:
    get:
      operationId: getAuthoringSession
      summary: Read the current authoring revision, conversation, assets, and diff
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      responses:
        "200":
          description: Current authoring session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoringSession"
        "404":
          $ref: "#/components/responses/Error"

  /authoring/sessions/{id}/messages:
    post:
      operationId: sendAuthoringMessage
      summary: Send one natural-language instruction to the authoring agent
      tags: [authoring]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthoringSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoringMessageRequest"
      responses:
        "200":
          description: Server-sent authoring ready, delta, complete, and error events
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /generator/plans:
    post:
      operationId: setGenerationPlan
      summary: Create or revise one user-owned generation plan
      tags: [generator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorPlanRequest"
      responses:
        "200":
          description: Persisted plan revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorPlanResponse"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows:
    get:
      operationId: listActiveGenerations
      summary: List the authenticated user's unfinished generation workflows
      tags: [generator]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unfinished generation workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflowList"
    post:
      operationId: confirmGeneration
      summary: Confirm one persisted plan revision and create its workflow
      tags: [generator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorGenerationConfirmationRequest"
      responses:
        "200":
          description: Generation workflow created or returned from its idempotency receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}:
    get:
      operationId: getGeneration
      summary: Read one user-owned workflow and its safe candidate review projection
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      responses:
        "200":
          description: Generator workflow and current candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorGeneration"
        "404":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/review-bundle:
    get:
      operationId: getGeneratorReviewBundle
      summary: Download one immutable author review bundle
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [content, classification]
      responses:
        "200":
          description: Version-bound review manifest and deterministic tar.gz payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorReviewBundle"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/turn:
    post:
      operationId: startGeneratorWorkspaceTurn
      summary: Bind one explicit generator turn to a workflow workspace
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceTurnRequest"
      responses:
        "200":
          description: Workspace turn is bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceTurn"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/turn/end:
    post:
      operationId: endGeneratorWorkspaceTurn
      summary: Release one explicit generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceTurnRequest"
      responses:
        "204":
          description: Workspace turn released
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/files:
    get:
      operationId: listGeneratorWorkspaceFiles
      summary: List files in one bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
        - $ref: "#/components/parameters/GeneratorTurnID"
      responses:
        "200":
          description: Safe relative workspace file entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceFileList"
        "409":
          $ref: "#/components/responses/Error"
    put:
      operationId: writeGeneratorWorkspaceFile
      summary: Write one relative file in a bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceFileWriteRequest"
      responses:
        "204":
          description: Workspace file written
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/file:
    get:
      operationId: readGeneratorWorkspaceFile
      summary: Read a relative file from one bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
        - $ref: "#/components/parameters/GeneratorTurnID"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Selected workspace file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceFileRead"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/workspace/commands:
    post:
      operationId: runGeneratorWorkspaceCommand
      summary: Run one command inside a bound generator workspace turn
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorWorkspaceCommandRequest"
      responses:
        "200":
          description: Command exit code and output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkspaceCommandResult"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/candidate:
    post:
      operationId: submitGeneratorCandidate
      summary: Submit the archive from one bound workspace turn as an immutable candidate
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorCandidateSubmissionRequest"
      responses:
        "200":
          description: Candidate submission accepted or returned from its idempotency receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorGeneration"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/content/confirm:
    post:
      operationId: confirmGeneratorContent
      summary: Confirm a verified candidate and begin classification
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorContentConfirmationRequest"
      responses:
        "200":
          description: Workflow advanced to classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/content/changes:
    post:
      operationId: requestGeneratorContentChanges
      summary: Return a reviewed candidate to generating with user feedback
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorContentChangeRequest"
      responses:
        "200":
          description: Workflow returned to generating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/classification:
    get:
      operationId: getGeneratorClassification
      summary: Read the current private classification proposal for one workflow
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      responses:
        "200":
          description: Candidate-bound classification proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorClassificationReview"
        "404":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/classification/changes:
    post:
      operationId: requestGeneratorClassificationChanges
      summary: Ask the Server classifier to revise one private proposal
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorClassificationChangeRequest"
      responses:
        "200":
          description: Workflow advanced to classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/classification/publish:
    post:
      operationId: confirmGeneratorClassificationAndPublish
      summary: Confirm one private classification proposal and begin challenge publication
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorClassificationPublicationRequest"
      responses:
        "200":
          description: Workflow advanced to challenge publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

  /generator/workflows/{workflow_id}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel one unfinished generation workflow
      tags: [generator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeneratorWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratorCancellationRequest"
      responses:
        "200":
          description: Workflow cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorWorkflow"
        "409":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    AuthoringSessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    GeneratorWorkflowID:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    GeneratorTurnID:
      name: turn_id
      in: query
      required: true
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 6

    RegisterResponse:
      type: object
      required: [totp_secret, totp_url]
      properties:
        totp_secret:
          type: string
        totp_url:
          type: string

    LoginRequest:
      type: object
      required: [username, password, totp_code]
      properties:
        username:
          type: string
        password:
          type: string
        totp_code:
          type: string

    LoginResponse:
      type: object
      required: [token, user_id, name]
      properties:
        token:
          type: string
          description: JWT access token
        user_id:
          type: string
        name:
          type: string

    MySpaceChallenge:
      type: object
      required: [id, title, runtime, difficulty]
      properties:
        id:
          type: string
        title:
          type: string
        runtime:
          type: string
          enum: [node, k8s]
        difficulty:
          type: string

    MySpaceProfile:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    MySpaceEnvironmentQuota:
      type: object
      required: [occupied, maximum]
      properties:
        occupied:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
          nullable: true

    MySpaceSummary:
      type: object
