          type: string
        role:
          type: string
          enum: [user, agent, system, event]
        content:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AuthoringChange"
        event:
          $ref: "#/components/schemas/AuthoringRunEvent"
        created_at:
          type: string
          format: date-time

    AuthoringRunEvent:
      type: object
      required: [schema_version, kind, run_id, reason, resumable, recovery]
      properties:
