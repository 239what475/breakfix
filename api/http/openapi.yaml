          enum: [1]
        kind:
          type: string
          enum: [authoring_run_interrupted, authoring_run_failed]
        run_id:
          type: string
        reason:
          type: string
          enum: [deadline_exceeded, server_stopping, server_restarted, permanent_executor_error]
        resumable:
          type: boolean
        recovery:
          type: string
          enum: [workspace, snapshot, candidate, empty]

