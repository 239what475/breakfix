        candidate_archive_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        payload_sha256:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        exported_at:
          type: string
          format: date-time

