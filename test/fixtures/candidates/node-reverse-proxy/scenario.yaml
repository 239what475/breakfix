runtime: node
type: operations-scenario
title: Repair a multi-node reverse proxy
description: Restore the systemd-managed proxy path from a client node to an application node.
versions:
  - component: socat
    version: system-package
  - component: breakfix-demo-response
    version: v1
topology: "Three Node containers: a client reaches an application service through a systemd-managed proxy."
initialization: "generate.sh starts the application on app:8080 and a proxy with an intentionally incorrect app:9090 upstream."
reproduction:
  objective: "The proxy points to the wrong upstream, so the client cannot reach the application through proxy:8080."
  evidence:
    - id: proxy-upstream-misconfigured
      description: "The proxy systemd unit still targets app:9090 instead of the application port."
      node: proxy
    - id: application-unreachable
      description: "The client cannot receive the expected response through proxy:8080."
      node: client
nodes:
  - name: client
    title: Client
  - name: proxy
    title: Reverse proxy
  - name: app
    title: Application server
checkpoints:
  - id: proxy-service-ready
    title: Proxy service is healthy
    description: The systemd proxy service is active and forwards to the application port.
    hint: hints/proxy-service-ready.md
    node: proxy
  - id: application-reachable
    title: Application is reachable
    description: The client receives the expected response through the proxy node.
    hint: hints/application-reachable.md
    node: client
