apiVersion: v1
kind: Service
metadata:
  name: document-agent-fixture
spec:
  selector:
    app.kubernetes.io/name: document-agent-fixture
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-agent-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-agent-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-agent-fixture
    spec:
      containers:
        - name: fixture
          image: breakfix/document-agent-fixture:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
