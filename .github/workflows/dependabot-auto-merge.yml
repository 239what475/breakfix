name: Dependabot auto-merge

# Registers merge intent on Dependabot PRs that are not major bumps; the
# branch protection rules decide when the merge actually happens (all five
# fast-lane checks green). Major bumps stay in the queue for human review,
# matching the dependabot.yml grouping intent. fetch-metadata verifies by
# default that the PR head is a Dependabot-signed commit, so a lookalike
# PR cannot ride this path.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: metadata
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for non-major bumps
        # Grouped PRs carry no single update-type and are minor+patch by
        # construction, so an empty value merges too.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
