name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_DB: breakfix
          POSTGRES_USER: breakfix
          POSTGRES_PASSWORD: breakfix
        options: >-
          --health-cmd "pg_isready -U breakfix -d breakfix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      BREAKFIX_TEST_DATABASE_URL: postgres://breakfix:breakfix@localhost:5432/breakfix?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build web application
        run: make web-build
      - name: Verify generated contracts
        run: make verify-generated
      - name: Test Go packages against PostgreSQL
        run: go test -count=1 ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build web application
        run: make web-build
      - name: Compile every runtime entrypoint
        run: |
          for component in server controller generate-worker taxonomy-worker; do
            go build -ldflags "-X github.com/breakfix/breakfix/internal/build.Version=dev" -o "$RUNNER_TEMP/breakfix-$component" "./cmd/$component"
          done
