name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Validate Playwright project
        run: |
          npm ci --prefix test
          npm run test:e2e --prefix test -- --list
      - name: Verify generated CRD files
        run: make verify-crd-generated
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Build
        run: |
          go build -ldflags "-X github.com/breakfix/breakfix/internal/build.Version=dev" -o /dev/null ./cmd/gateway
