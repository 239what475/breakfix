name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_DB: breakfix
          POSTGRES_USER: breakfix
          POSTGRES_PASSWORD: breakfix
        options: >-
          --health-cmd "pg_isready -U breakfix -d breakfix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      BREAKFIX_TEST_DATABASE_URL: postgres://breakfix:breakfix@localhost:5432/breakfix?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Verify generated CRD files
        run: make verify-crd-generated
      - name: Verify generated API types
        run: make verify-api-generated
      - name: Test Go packages against PostgreSQL
        run: go test -count=1 ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Compile every runtime entrypoint
        run: |
          for component in server controller agent-worker builder publisher verifier; do
            go build -ldflags "-X github.com/breakfix/breakfix/internal/build.Version=dev" -o "$RUNNER_TEMP/breakfix-$component" "./cmd/$component"
          done

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_DB: breakfix
          POSTGRES_USER: breakfix
          POSTGRES_PASSWORD: breakfix
        options: >-
          --health-cmd "pg_isready -U breakfix -d breakfix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      BREAKFIX_DATABASE_URL: postgres://breakfix:breakfix@localhost:5432/breakfix?sslmode=disable
      BREAKFIX_AGENT_DATABASE_URL: postgres://breakfix:breakfix@localhost:5432/breakfix?sslmode=disable
      BREAKFIX_REGISTRY_USERNAME: smoke
      BREAKFIX_REGISTRY_PASSWORD: smoke
      OPEN_SANDBOX_API_KEY: smoke-only-no-network-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - uses: helm/kind-action@v1.12.0
      - name: Install CRDs for Server background projectors
        run: |
          kubectl create namespace breakfix-system
          make dev-crd
      - name: Build frontend and start the Server
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          cp -a test/fixtures/catalog "$RUNNER_TEMP/catalog-data"
          sed \
            -e "s|^data_dir:.*|data_dir: $RUNNER_TEMP/catalog-data|" \
            -e "s|^kubeconfig:.*|kubeconfig: ${KUBECONFIG:-$HOME/.kube/config}|" \
            config/breakfix.example.yaml > "$RUNNER_TEMP/breakfix-browser-smoke.yaml"
          go run ./cmd/server -config "$RUNNER_TEMP/breakfix-browser-smoke.yaml" > "$RUNNER_TEMP/breakfix-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/breakfix-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:9090/readyz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/breakfix-server.log"
          exit 1
      - name: Run fixed-catalog browser smoke
        run: |
          npm ci --prefix test
          npx --prefix test playwright install --with-deps chromium
          npm run test:e2e --prefix test -- catalog.spec.ts --workers=1
        env:
          CI: "true"
      - name: Print Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/breakfix-server.log"
      - name: Stop Server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/breakfix-server.pid")" 2>/dev/null || true
