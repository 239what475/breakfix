name: CI

# Solo-maintainer repository: the fast lane runs on every push to main as a
# clean-environment backstop for the local loop, not as a merge gate. With
# Dependabot as the first "collaborator", pull_request now runs the same
# jobs on PRs so dependency bumps are verified before they merge; direct
# pushes by the owner stay unaffected (admins are exempt from protection).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_DB: breakfix
          POSTGRES_USER: breakfix
          POSTGRES_PASSWORD: breakfix
        options: >-
          --health-cmd "pg_isready -U breakfix -d breakfix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      BREAKFIX_TEST_DATABASE_URL: postgres://breakfix:breakfix@localhost:5432/breakfix?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ripgrep for the legacy-removal scan
        run: sudo apt-get install -y -qq ripgrep
      - name: Test Go packages against PostgreSQL
        run: make test-unit

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Race sweep over the DB-free tier
        run: make test-race

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run the web component tier
        run: make web-test-unit

  contracts-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify generated contracts
        run: make verify-generated
      - name: Build runtime applications once
        run: make build
      - name: Render the deployment packages
        run: |
          kubectl kustomize . >/dev/null
          kubectl kustomize deploy/overlays/kind >/dev/null
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
