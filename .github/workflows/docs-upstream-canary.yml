name: Docs upstream canary

# Forward-looking warning, not a gate: every week it resolves the newest
# kubernetes/website dev-* release branch and runs the full pinned pipeline
# (sync -> build -> parse -> check -> smoke) against that upstream SHA with
# the manifest pin overridden. A red canary means the next manifest bump
# will hurt; it never blocks the nightly and says nothing about main.
# workflow_dispatch doubles as the pre-bump check before editing the pin.

on:
  schedule:
    - cron: "0 21 * * 1" # Tuesday 05:00 Asia/Shanghai, off the nightly hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the newest upstream release branch
        id: upstream
        run: |
          set -eu
          repo="$(sed -n 's/^repository:[[:space:]]*//p' docs-site/manifest.yaml)"
          test -n "$repo"
          branch="$(git ls-remote --heads "$repo" 'refs/heads/dev-*' \
            | awk '{print $2}' | sed 's|refs/heads/||' | sort -V | tail -1)"
          test -n "$branch"
          sha="$(git ls-remote --heads "$repo" "refs/heads/$branch" | awk '{print $1}')"
          test -n "$sha"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved $branch at $sha"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ripgrep for the docs scripts
        run: sudo apt-get install -y -qq ripgrep
      - name: Restore the upstream checkout
        uses: actions/cache@v6
        with:
          path: .local/docs-canary
          key: docs-upstream-canary-${{ steps.upstream.outputs.sha }}
      - name: Run the pinned pipeline against the upstream head
        env:
          DOCS_CACHE_DIR: ${{ github.workspace }}/.local/docs-canary
          DOCS_REVISION: ${{ steps.upstream.outputs.sha }}
          DOCS_VERSION: canary-${{ steps.upstream.outputs.sha }}
        run: |
          make docs-sync
          make docs-build
          make docs-project
          make docs-smoke
      - name: Report the delta against the pin
        if: always()
        run: |
          echo "pinned revision: $(sed -n 's/^revision:[[:space:]]*//p' docs-site/manifest.yaml)"
          echo "canary revision: ${{ steps.upstream.outputs.sha }} (${{ steps.upstream.outputs.branch }})"
          echo "green = the next manifest bump is routine; red = fix the pipeline before bumping"
