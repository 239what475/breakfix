name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X 'github.com/breakfix/breakfix/internal/build.Version=${VERSION}' \
            -X 'github.com/breakfix/breakfix/internal/build.BuildTime=${BUILD_TIME}' \
            -X 'github.com/breakfix/breakfix/internal/build.Commit=${COMMIT}'"

          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/breakfix-gateway-linux-amd64   ./cmd/gateway
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/breakfix-gateway-darwin-amd64  ./cmd/gateway

          ls -lh dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
