name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_TIME: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT: ${{ github.sha }}
        run: |
          LDFLAGS="-s -w \
            -X 'github.com/breakfix/breakfix/internal/build.Version=${VERSION}' \
            -X 'github.com/breakfix/breakfix/internal/build.BuildTime=${BUILD_TIME}' \
            -X 'github.com/breakfix/breakfix/internal/build.Commit=${COMMIT}'"

          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/breakfix-api-linux-amd64   ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/breakfix-api-darwin-amd64  ./cmd/server
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/breakfix-cli-linux-amd64   ./cmd/cli
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/breakfix-cli-darwin-amd64  ./cmd/cli

          ls -lh dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
