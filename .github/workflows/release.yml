name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web application
        run: make web-build
      - name: Verify generated deployment contracts
        run: make verify-generated
      - name: Publish OCI images and digest-pinned deployment manifest
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUNTIME_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
          RUNTIME_IMAGE_TAG: ${{ github.ref_name }}
        run: make release-manifest TARGETOS=linux TARGETARCH=amd64
      - name: Release deployment artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/breakfix-${{ github.ref_name }}.yaml
          generate_release_notes: true
