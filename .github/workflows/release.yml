name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the pinned upstream documentation checkout
        uses: actions/cache@v6
        with:
          path: .local/docs
          key: docs-upstream-${{ hashFiles('docs-site/manifest.yaml') }}
      - name: Install ripgrep for the docs scripts
        run: sudo apt-get install -y -qq ripgrep
      - name: Verify generated deployment contracts
        run: make verify-generated
      - name: Publish OCI images and digest-pinned deployment manifest
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUNTIME_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
          RUNTIME_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          make docs-sync
          make docs-build
          make images TARGETOS=linux TARGETARCH=amd64
          make documentation-library-image TARGETOS=linux TARGETARCH=amd64
          # The server manifest mounts the documentation library as an image
          # volume, so a release must publish it and pin its digest exactly
          # like the runtime components — a tag reference here would deploy
          # to ImagePullBackOff.
          for component in server controller runtime-worker documentation-library; do
            image="$RUNTIME_IMAGE_REPOSITORY/breakfix-$component:$RUNTIME_IMAGE_TAG"
            docker push "$image"
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            test -n "$digest"
            printf '%s@%s\n' "$RUNTIME_IMAGE_REPOSITORY/breakfix-$component" "$digest" > "/tmp/breakfix-$component.ref"
          done
          mkdir -p dist
          kubectl kustomize . > "dist/breakfix-$RUNTIME_IMAGE_TAG.yaml"
          for component in server controller runtime-worker documentation-library; do
            reference="$(cat "/tmp/breakfix-$component.ref")"
            sed -i "s|ghcr.io/breakfix/breakfix-$component:dev|$reference|g" "dist/breakfix-$RUNTIME_IMAGE_TAG.yaml"
          done
          ! grep -Eq 'ghcr.io/breakfix/breakfix-(server|controller|runtime-worker|documentation-library):dev' "dist/breakfix-$RUNTIME_IMAGE_TAG.yaml"
      - name: Release deployment artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/breakfix-${{ github.ref_name }}.yaml
          generate_release_notes: true
