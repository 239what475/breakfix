name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify generated deployment contracts
        run: make verify-generated
      - name: Publish OCI images and digest-pinned deployment manifest
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUNTIME_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}
          RUNTIME_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          make images TARGETOS=linux TARGETARCH=amd64
          for component in server controller runtime-worker; do
            image="$RUNTIME_IMAGE_REPOSITORY/breakfix-$component:$RUNTIME_IMAGE_TAG"
            docker push "$image"
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            test -n "$digest"
            printf '%s@%s\n' "$RUNTIME_IMAGE_REPOSITORY/breakfix-$component" "$digest" > "/tmp/breakfix-$component.ref"
          done
          mkdir -p dist
          kubectl kustomize . > "dist/breakfix-$RUNTIME_IMAGE_TAG.yaml"
          for component in server controller runtime-worker; do
            reference="$(cat "/tmp/breakfix-$component.ref")"
            sed -i "s|ghcr.io/breakfix/breakfix-$component:dev|$reference|g" "dist/breakfix-$RUNTIME_IMAGE_TAG.yaml"
          done
          ! grep -Eq 'ghcr.io/breakfix/breakfix-(server|controller|runtime-worker):dev' "dist/breakfix-$RUNTIME_IMAGE_TAG.yaml"
      - name: Release deployment artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/breakfix-${{ github.ref_name }}.yaml
          generate_release_notes: true
