kind: Skill
id: skill-fc8e3a1b7d5290c4
title: find 多条件文件定位
definition: 使用 find 命令组合文件类型、名称模式、修改时间（mtime）和文件大小（size）等多种条件，精确筛选文件系统对象。
mapping_guidance:
    outcome_when:
        - 题目要求使用 find 的 -mtime、-size 等元数据条件组合定位文件
        - 题目核心在于通过文件属性条件进行筛选
    entry_when:
        - 题目假设用户已会使用 find 的基本条件（-name、-type）但未涉及 mtime/size 组合
    exclude_when:
        - 仅使用 ls 或通配符匹配文件而未使用 find
        - find 仅用于 -name 或 -type 等单一简单条件
