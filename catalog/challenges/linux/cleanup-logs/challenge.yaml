runtime: node
title: "批量压缩旧日志"
difficulty: easy
description: |
  服务器磁盘空间不足，/var/log 下有大量历史日志文件。

  你的任务：编写 /usr/local/bin/cleanup.sh，实现：
  1. 找出 /var/log 下 7 天前（mtime > 6 天）、大于 100MB 的 .log 文件
  2. 批量压缩到 /backup 目录（用 tar.gz 格式）
  3. 原文件可以不保留

  完成后运行脚本，检查点会显示当前修复进度。
nodes:
  - name: host
    title: 日志服务器
checkpoints:
  - id: cleanup-script-ready
    title: 创建清理脚本
    description: /usr/local/bin/cleanup.sh 存在且可执行。
    hint: hints/cleanup-script-ready.md
    node: host
  - id: eligible-logs-archived
    title: 归档目标日志
    description: 所有超过 7 天且大于 100MB 的日志均已生成有效归档。
    hint: hints/eligible-logs-archived.md
    node: host
  - id: protected-logs-preserved
    title: 保留不应处理的日志
    description: 新日志和小日志没有被错误归档。
    hint: hints/protected-logs-preserved.md
    node: host
