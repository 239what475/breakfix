# Breakfix server configuration.
# Copy to breakfix.yaml and adjust for your environment.

# gRPC port
port: 9090

# HTTP forward proxy for Pod egress
proxy_port: 3128

# Data directory (SQLite DB, CA certs, challenges)
#   Local:  ./data
#   Server: /var/lib/breakfix
data_dir: ./data

# Kubeconfig path
#   Local (Kind):  ~/.kube/config
#   Server (ACK):  /var/lib/breakfix/kubeconfig
kubeconfig: ~/.kube/config

# Container registry (VPC internal address — ACK pulls from this)
#   Local:  localhost:5000
#   Server: crpi-xxxx-vpc.cn-hangzhou.personal.cr.aliyuncs.com
#   Public push address is derived by removing "-vpc" from this value.
registry: localhost:5000

# ACR / registry namespace
acr_namespace: breakfix

# Agent workflow — LLM API (Anthropic-compatible endpoint)
llm:
  base_url: https://api.deepseek.com/anthropic
  model: deepseek-v4-pro
  haiku_model: deepseek-v4-flash
  effort: max
  api_key: sk-your-deepseek-api-key

# ── Deployment target (SSH host, must exist in ~/.ssh/config) ──
# Create .breakfix-server with one line: your-server-name
#   echo myserver2 > .breakfix-server
