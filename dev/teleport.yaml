version: v3

teleport:
  nodename: breakfix-dev
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: yes
  cluster_name: breakfix-dev
  listen_addr: 0.0.0.0:3025
  proxy_listener_mode: multiplex
  authentication:
    type: local
    second_factor: otp

ssh_service:
  enabled: yes

proxy_service:
  enabled: yes
  web_listen_addr: 0.0.0.0:3080
  public_addr: localhost:3080
  ssh_public_addr: localhost:3023
  kube_listen_addr: 0.0.0.0:3026
  kube_public_addr: localhost:3026
