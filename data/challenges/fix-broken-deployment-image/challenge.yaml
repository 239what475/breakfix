id: fix-broken-deployment-image
type: script
runtime: vcluster
title: "修复错误的 Deployment 镜像"
difficulty: easy
tags:
  - kubernetes
  - kubectl
  - deployment
  - image
image: fix-broken-deployment-image:v1

description: |
  你正在一个带有 kubeconfig 的工作容器中排查 Kubernetes 环境。

  `default` 命名空间里有一个名为 `web` 的 Deployment，但它当前不可用。

  你的任务：
  1. 使用 `kubectl` 检查 `web` Deployment 的状态
  2. 找出它无法正常运行的原因
  3. 修复问题，使 Deployment 恢复为可用状态

  完成后可通过检查点查看 Deployment、Service 和副本状态。

checkpoints:
  - id: web-resources-present
    title: 确认目标资源存在
    description: default 命名空间中的 web Deployment 和 Service 均存在。
    hint: hints/web-resources-present.md
  - id: web-deployment-available
    title: 恢复 Deployment 可用性
    description: web Deployment 的可用副本数达到期望副本数。
    hint: hints/web-deployment-available.md
    dependsOn: [web-resources-present]
  - id: web-service-preserved
    title: 保持 Service 配置
    description: web Service 仍选择 app=web 工作负载并暴露端口。
    hint: hints/web-service-preserved.md
    dependsOn: [web-resources-present]
