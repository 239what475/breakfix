kind: Skill
id: skill-9a2e5b1d7c8340f6
title: tar 压缩归档管理
definition: 使用 tar 命令创建、列出和验证 gzip/bzip2 等格式的压缩归档文件，理解归档路径与内容路径的关系。
mapping_guidance:
    outcome_when:
        - 题目要求创建 tar.gz 或类似压缩归档文件
        - 需要验证归档内容完整性或检查归档内文件列表
    entry_when:
        - 题目提供现成的 tar 命令模板，用户只需微调参数
    exclude_when:
        - 仅使用 zip/unzip 等非 tar 工具进行压缩
        - 题目不涉及归档的创建或验证
