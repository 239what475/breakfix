kind: Skill
id: skill-6b3c8e2f1a7459d0
title: 可执行 Shell 脚本创建
definition: 编写包含正确的 shebang、执行权限（chmod +x）和防御性选项（set -euo pipefail）的 Shell 脚本文件，使其可作为独立程序运行。
mapping_guidance:
    outcome_when:
        - 题目明确要求从零创建新的可执行脚本文件
    entry_when:
        - 题目假设用户能自行创建脚本文件并赋予执行权限，但不以此为主要练习目标
    exclude_when:
        - 只需要在交互式 Shell 中执行命令而不需要创建脚本文件
