# In-cluster configuration. The runtime Deployment mounts this as
# /etc/breakfix/config.yaml; secret values are expanded from its environment.
port: 9090
health_port: 8081

data_dir: /var/lib/breakfix
database_url: ${BREAKFIX_DATABASE_URL}
agent_database_url: ${BREAKFIX_AGENT_DATABASE_URL}
agent_database_role: breakfix_agent
kubeconfig: ""

registry_addr: registry.breakfix.internal/breakfix
registry_insecure: false
registry_pull_secret: breakfix-registry-pull
registry_write_secret: breakfix-registry-write
builder_image: ghcr.io/breakfix/breakfix-builder:dev
publisher_image: ghcr.io/breakfix/breakfix-publisher:dev
verifier_image: ghcr.io/breakfix/breakfix-verifier:dev

vcluster_binary: /usr/local/bin/vcluster
vcluster_chart_repo: https://charts.loft.sh
vcluster_chart_version: "0.35.1"

server_host: breakfix-server
ui_origin: ${BREAKFIX_UI_ORIGIN}
namespace: breakfix
crd_namespace: breakfix-system
cooldown_minutes: 5

jwt_secret: ${BREAKFIX_JWT_SECRET}
internal_api_key: ${BREAKFIX_INTERNAL_API_KEY}
verification_grant_key: ${BREAKFIX_VERIFICATION_GRANT_KEY}

agent:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-pro
  request_timeout: 2m
  server_url: http://breakfix-server:9090

opensandbox:
  base_url: ${BREAKFIX_OPENSANDBOX_BASE_URL}
  api_key_env: OPEN_SANDBOX_API_KEY
  namespace: ${BREAKFIX_OPENSANDBOX_NAMESPACE}
  workspace_image: ubuntu:22.04
  workspace_storage: 5Gi
