# Breakfix runtime configuration.
# Copy this file to config/breakfix.yaml and adjust it for the target environment.

# HTTP and controller health endpoints.
port: 9090
health_port: 8081

# Persistent server state: artifacts and the filesystem challenge catalog.
data_dir: ./data
# PostgreSQL is the only relational database. The Server data directory is not
# a database volume and must not be shared with the Controller or Agent Worker.
database_url: ${BREAKFIX_DATABASE_URL}
# Agent Worker uses a separate credential restricted to agent_* tables.
agent_database_url: ${BREAKFIX_AGENT_DATABASE_URL}
agent_database_role: breakfix_agent
kubeconfig: ~/.kube/config

# Registry address includes the repository namespace used for challenge images.
registry_addr: localhost:5000/break-fix
registry_insecure: true
# The Docker config Secret is copied into every transient challenge namespace
# for kubelet image pulls. The separate verifier write Secret stays in the
# control-plane namespace.
registry_pull_secret: breakfix-registry-pull
registry_write_secret: breakfix-registry-write
builder_image: ghcr.io/breakfix/breakfix-builder:dev
publisher_image: ghcr.io/breakfix/breakfix-publisher:dev
verifier_image: ghcr.io/breakfix/breakfix-verifier:dev

# vcluster command and chart source.
vcluster_binary: vcluster
vcluster_chart_repo: https://charts.loft.sh
vcluster_chart_version: "0.35.1"

# Server endpoint used by the Controller-created Builder and Publisher Jobs.
server_host: 172.18.0.1
# Exact public browser origin allowed to open terminal WebSockets.
ui_origin: http://localhost:9090
namespace: breakfix
crd_namespace: breakfix-system
cooldown_minutes: 5

# Replace these development-only values before any public deployment.
jwt_secret: breakfix-dev-secret-change-in-production
internal_api_key: breakfix-dev-internal-key-change-in-production
# Only the Server and Controller receive this key. It signs short-lived,
# task-bound Build/Publisher grants and is never injected into those Jobs.
verification_grant_key: breakfix-dev-verification-grant-key-change-in-production

# Agent workflow (DeepSeek Chat Completions API).
agent:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-pro
  request_timeout: 2m
  # Agent Worker reaches the Server through its in-cluster ClusterIP Service.
  server_url: http://breakfix-server

# Generator workspaces are Server-owned BYO PVCs mounted by OpenSandbox. The
# lifecycle API key is only present in the Server process, never Agent Worker.
# Each Generator Run creates one ManualCleanup Sandbox and Server deletes the
# Sandbox and PVC when that Run reaches a terminal state.
opensandbox:
  base_url: http://opensandbox-server.opensandbox.svc.cluster.local
  api_key_env: OPEN_SANDBOX_API_KEY
  namespace: opensandbox
  workspace_image: ubuntu:22.04
  workspace_storage: 5Gi
