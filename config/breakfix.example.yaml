# Breakfix runtime configuration.
# Copy this file to config/breakfix.yaml and adjust it for the target environment.

# HTTP, proxy, and controller health endpoints.
port: 9090
proxy_port: 3128
health_port: 8081

# Persistent server state: CA material, artifacts, and the filesystem challenge catalog.
data_dir: ./data
# PostgreSQL is the only relational database. The Server data directory is not
# a database volume and must not be shared with the Controller or Agent Worker.
database_url: ${BREAKFIX_DATABASE_URL}
# Agent Worker uses a separate credential restricted to agent_* tables.
agent_database_url: ${BREAKFIX_AGENT_DATABASE_URL}
agent_database_role: breakfix_agent
kubeconfig: ~/.kube/config

# Registry address includes the repository namespace used for challenge images.
registry_addr: localhost:5000/break-fix
registry_insecure: true
k8s_base_image: breakfix-k8s-base:latest

# vcluster command and chart source.
vcluster_binary: vcluster
vcluster_chart_repo: https://charts.loft.sh
vcluster_chart_version: ""

# Empty uses the default host reachable from cluster Jobs. Set an explicit host in remote deployments.
server_host: ""
namespace: breakfix
crd_namespace: breakfix-system
cooldown_minutes: 5

# Replace these development-only values before any public deployment.
jwt_secret: breakfix-dev-secret-change-in-production
internal_api_key: breakfix-dev-internal-key-change-in-production

# Agent workflow (DeepSeek Chat Completions API).
agent:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-v4-pro
  request_timeout: 2m
